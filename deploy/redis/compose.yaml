# Redis 1대. 로컬은 redis://127.0.0.1:6379 (DB 0). 클러스터는 redis.slots.<id> 번호.
name: hackertone-redis
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
