{{- range .Values.hubs }}
{{- $ctx := dict "folder" .folder "root" $ }}
{{- $scaled := eq (include "hackertone-games.hubScaled" $ctx) "true" }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .folder }}-hub
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
spec:
  serviceName: {{ .folder }}-hub-pods
  replicas: {{ include "hackertone-games.hubApplyReplicas" $ctx }}
  podManagementPolicy: Parallel
  updateStrategy:
    type: {{ $.Values.hub.strategy | default "RollingUpdate" }}
  selector:
    matchLabels:
      {{- include "hackertone-games.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: hub
      hackertone-games/slot: {{ .folder }}
  template:
    metadata:
      labels:
        {{- include "hackertone-games.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: hub
        hackertone-games/slot: {{ .folder }}
    spec:
      enableServiceLinks: false
      # LobbyRoom.onBeforeShutdown 이 진행 중 매치를 HUB_CONFIG.shutdownDrainMs 만큼
      # 봐준다 — kubelet 기본 30s 로는 그 전에 SIGKILL 돼서 드레인이 무의미해진다.
      terminationGracePeriodSeconds: {{ $.Values.hub.terminationGracePeriodSeconds }}
      # hostname 은 StatefulSet 이 <folder>-hub-N 으로 넣는다. 템플릿에 비우지 않는다.
      subdomain: {{ .folder }}-hub-pods
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: "{{ .image | default $.Values.hub.image.repository }}:{{ .tag | default $.Values.hub.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ $.Values.hub.env.PORT | quote }}
            - name: SLOT_FOLDER
              value: {{ .folder | quote }}
            - name: DAGUL_SKILLS
              value: "on"
            {{- if and $.Values.redis.enabled $.Values.redis.url }}
            - name: REDIS_URL
              value: {{ include "hackertone-games.hubRedisUrl" (dict "root" $ "folder" .folder "hub" .) | quote }}
            {{- end }}
            {{- if $.Values.hub.publicPrefix }}
            - name: HUB_PUBLIC_PREFIX
              value: {{ printf $.Values.hub.publicPrefix .folder | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
            {{- if and $.Values.hub.staticSplit $scaled }}
            - name: HUB_STATIC_SPLIT
              value: "1"
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- if $scaled }}
            {{- toYaml $.Values.hub.scale.resources | nindent 12 }}
            {{- else }}
            {{- toYaml $.Values.hub.resources | nindent 12 }}
            {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .folder }}-hub
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
spec:
  selector:
    {{- include "hackertone-games.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- if $.Values.hub.publicPrefix }}
---
# Pod별 안정 DNS — publicAddress(/hubp/<pod-name>) 직접연결 라우팅용.
# 기존 ClusterIP Service 는 매치메이킹 라운드로빈용으로 그대로 유지된다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .folder }}-hub-pods
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
spec:
  clusterIP: None
  selector:
    {{- include "hackertone-games.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
{{- $as := $.Values.hub.scale.autoscaling | default dict }}
{{- if and $scaled $as.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ .folder }}-hub
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: {{ .folder }}-hub
  minReplicas: {{ include "hackertone-games.hubReplicas" $ctx }}
  maxReplicas: {{ required "hub.scale.maxReplicas 가 필요합니다" $.Values.hub.scale.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $as.targetCPUUtilizationPercentage | default 70 }}
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: {{ $as.scaleDownStabilizationSeconds | default 600 }}
      selectPolicy: Min
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
{{- end }}
{{- if and $.Values.hub.staticSplit $scaled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .folder }}-hub-static
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub-static
    hackertone-games/slot: {{ .folder }}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "hackertone-games.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: hub-static
      hackertone-games/slot: {{ .folder }}
  template:
    metadata:
      labels:
        {{- include "hackertone-games.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: hub-static
        hackertone-games/slot: {{ .folder }}
    spec:
      enableServiceLinks: false
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: static
          image: "{{ .image | default $.Values.hub.image.repository }}:{{ .tag | default $.Values.hub.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ $.Values.hub.env.PORT | quote }}
            - name: SLOT_FOLDER
              value: {{ .folder | quote }}
            - name: HUB_ROLE
              value: static
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.hub.scale.staticResources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .folder }}-hub-static
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub-static
    hackertone-games/slot: {{ .folder }}
spec:
  selector:
    {{- include "hackertone-games.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: hub-static
    hackertone-games/slot: {{ .folder }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- end }}
{{- end }}
