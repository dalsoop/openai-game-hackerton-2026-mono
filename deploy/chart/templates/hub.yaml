{{- range .Values.hubs }}
{{- $redisSidecar := and $.Values.redis.enabled (not $.Values.redis.url) }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .folder }}-hub
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
spec:
  replicas: {{ $.Values.hub.replicaCount }}
  strategy:
    type: {{ $.Values.hub.strategy | default "Recreate" }}
    {{- if eq ($.Values.hub.strategy | default "Recreate") "RollingUpdate" }}
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- end }}
  selector:
    matchLabels:
      {{- include "hackertone-games.selectorLabels" $ | nindent 6 }}
      app.kubernetes.io/component: hub
      hackertone-games/slot: {{ .folder }}
  template:
    metadata:
      labels:
        {{- include "hackertone-games.selectorLabels" $ | nindent 8 }}
        app.kubernetes.io/component: hub
        hackertone-games/slot: {{ .folder }}
    spec:
      enableServiceLinks: false
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: hub
          image: "{{ .image | default $.Values.hub.image.repository }}:{{ .tag | default $.Values.hub.image.tag }}"
          imagePullPolicy: {{ $.Values.imagePullPolicy }}
          env:
            - name: PORT
              value: {{ $.Values.hub.env.PORT | quote }}
            - name: SLOT_FOLDER
              value: {{ .folder | quote }}
            {{- if $.Values.redis.enabled }}
            - name: REDIS_URL
              value: {{ (default "redis://127.0.0.1:6379" $.Values.redis.url) | quote }}
            {{- end }}
            {{- if $.Values.hub.publicPrefix }}
            - name: HUB_PUBLIC_PREFIX
              value: {{ printf $.Values.hub.publicPrefix .folder | quote }}
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $.Values.hub.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
        {{- if $redisSidecar }}
        - name: redis
          image: {{ $.Values.redis.image | default "redis:7-alpine" }}
          imagePullPolicy: IfNotPresent
          args: ["--maxmemory-policy", "noeviction", "--save", ""]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 1
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .folder }}-hub
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
spec:
  selector:
    {{- include "hackertone-games.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
  ports:
    - name: http
      port: 80
      targetPort: 8080
{{- if $.Values.hub.publicPrefix }}
---
# Pod별 안정 DNS — publicAddress(/hubp/<pod-name>) 직접연결 라우팅용.
# 기존 ClusterIP Service 는 매치메이킹 라운드로빈용으로 그대로 유지된다.
apiVersion: v1
kind: Service
metadata:
  name: {{ .folder }}-hub-pods
  labels:
    {{- include "hackertone-games.labels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
spec:
  clusterIP: None
  selector:
    {{- include "hackertone-games.selectorLabels" $ | nindent 4 }}
    app.kubernetes.io/component: hub
    hackertone-games/slot: {{ .folder }}
  ports:
    - name: http
      port: 8080
      targetPort: 8080
{{- end }}
{{- end }}
