# env·호스트는 deploy/env.yaml 이 덮어쓴다.
env: ""

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: Never
nodeSelector:
  kubernetes.io/hostname: k3s-prod

git:
  repo: https://github.com/dalsoop/openai-game-hackerton-2026-mono
  revision: main
  syncSeconds: 60
  gamesHostPath: /data/hackertone/g

ingress:
  className: traefik
  annotations: {}

tls:
  enabled: true
  secretName: hackertone-games-tls
  issuer:
    create: true
    name: letsencrypt-cloudflare-external
    clusterIssuer: ""
    email: urit245@gmail.com
    dnsZones:
      - external.kr
    existingCloudflareSecret: cloudflare-api-token

web:
  replicaCount: 1
  image:
    repository: harbor.50.internal.xz/library/hackertone-games-web
    tag: 0.1.0-dev1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

hub:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  env:
    PORT: "8080"
  # 다중 복제 시: strategy: RollingUpdate + publicPrefix: "%s.external.kr/hubp"
  # (printf 형식 — %s 자리에 슬롯 폴더가 들어간다. /hubp/<pod-name> 직접연결)
  strategy: ""
  publicPrefix: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

redis:
  enabled: true
  # 차트에 Redis 1대. 모든 허브가 이 URL 을 쓴다.
  url: "redis://redis:6379"
  image: redis:7-alpine
  serviceName: redis
  storage: 1Gi

games: []
hubs: []
