# env·호스트는 deploy/env.yaml 이 덮어쓴다.
env: ""

nameOverride: ""
fullnameOverride: ""

imagePullPolicy: Never
nodeSelector:
  kubernetes.io/hostname: k3s-prod

git:
  repo: https://github.com/dalsoop/openai-game-hackerton-2026-mono
  revision: main
  syncSeconds: 60
  gamesHostPath: /data/hackertone/g

ingress:
  className: traefik
  annotations: {}

tls:
  enabled: true
  secretName: hackertone-games-tls
  issuer:
    create: true
    name: letsencrypt-cloudflare-external
    clusterIssuer: ""
    email: urit245@gmail.com
    dnsZones:
      - external.kr
    existingCloudflareSecret: cloudflare-api-token

web:
  replicaCount: 1
  image:
    repository: harbor.50.internal.xz/library/hackertone-games-web
    tag: 0.1.0-dev1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

hub:
  replicaCount: 1
  image:
    repository: ""
    tag: ""
  env:
    PORT: "8080"
  # 다중 복제 시: strategy: RollingUpdate + publicPrefix: "%s.external.kr/hubp"
  # (printf 형식 — %s 자리에 슬롯 폴더가 들어간다. /hubp/<pod-name> 직접연결)
  strategy: ""
  publicPrefix: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

redis:
  enabled: true
  # 비우면 허브 Pod에 redis 사이드카를 넣고 REDIS_URL=redis://127.0.0.1:6379
  # 슬롯마다 방을 격리한다. Redis pub/sub 은 DB 번호로 나뉘지 않는다.
  # 외부 Redis 를 쓰면 url 만 채운다. 사이드카는 안 뜬다.
  url: ""
  image: redis:7-alpine
  # 같은 슬롯을 여러 replica 로 올릴 때만 true. 공용 Deployment+PVC.
  standalone: false
  serviceName: redis
  storage: 1Gi

games: []
hubs: []
