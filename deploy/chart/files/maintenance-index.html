    --panel: rgba(3, 5, 7, 0.62); --line: rgba(57, 255, 106, 0.30);
    --text: #e8f0ff; --sub: #9fb3d1; --dim: #5c7397;
    --green: #39ff6a; --cyan: #70e7ff; --gold: #ffd166;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: radial-gradient(1100px 700px at 50% 18%, var(--bg-hi) 0%, var(--bg-mid) 55%, var(--bg-lo) 100%);
    color: var(--text); text-align: center;
    font-family: "Galmuri11", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  .card { padding: 40px 30px 34px; max-width: 460px; }
  .stage { position: relative; height: 168px; }
  .shadow {
    position: absolute; left: 50%; bottom: 8px; width: 84px; height: 20px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgba(0, 0, 0, 0.55), rgba(0, 0, 0, 0) 78%);
    animation: shadowhop 1.15s ease-in-out infinite;
  }

    image-rendering: pixelated;
    animation: hop 1.15s ease-in-out infinite;
    filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.35));
  }
  /* 인게임 이동 연출 근사 — 접지 스쿼시, 상승 스트레치 (hero_movement plant/hop) */
  @keyframes hop {
    0%   { transform: translateY(0) scale(1.07, 0.90); }
    32%  { transform: translateY(-26px) scale(0.95, 1.07); }
    58%  { transform: translateY(-4px) scale(1.0, 1.0); }
    76%  { transform: translateY(0) scale(1.05, 0.93); }
    100% { transform: translateY(0) scale(1.07, 0.90); }
  }
  @keyframes shadowhop {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 1; }
    32% { transform: translateX(-50%) scale(0.55); opacity: 0.4; }
  }
  h1 { font-size: 30px; font-weight: 700; margin: 16px 0 0; letter-spacing: 1px; }
  h1 .accent { color: var(--gold); }
  p { color: var(--sub); line-height: 1.75; font-size: 14px; }
  .dots {
    display: flex; gap: 12px; justify-content: center; margin-top: 28px;
  }
  .dots i {
    display: block; width: 8px; height: 8px;
    background: var(--green); image-rendering: pixelated;
    animation: dotbounce 1.0s ease-in-out infinite;
  }
  .dots i:nth-child(2) { animation-delay: 0.15s; }
  .dots i:nth-child(3) { animation-delay: 0.30s; }
  @keyframes dotbounce {
    0%, 70%, 100% { transform: translateY(0); opacity: 0.25; }
    35% { transform: translateY(-10px); opacity: 1; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hero, .shadow, .bar i { animation: none; }
  }
</style>
</head>
<body>
<main class="card">
  <div class="stage">
    <span class="shadow" aria-hidden="true"></span>
    <span class="hero" id="hero" role="img" aria-label="다굴 캐릭터"></span>
  </div>
  <h1 id="title">업데이트 <span class="accent">중</span></h1>
  <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
</main>
<script>
  // 인게임 렌더러와 같은 아틀라스 매핑 (debug_renderer ANIMAL_ATLAS_FRAME).
  var FRAME = [0, 1, 2, 3, 5, 4, 6, 7, 8, 9, 10, 11];
  var CELL = 128;
  var hero = document.getElementById("hero");
  var animal = Math.floor(Math.random() * 12);
  function show(i) {
    var f = FRAME[i % 12];
    hero.style.backgroundPosition = (-(f % 4) * CELL) + "px " + (-Math.floor(f / 4) * CELL) + "px";
  }
  show(animal);
  hero.addEventListener("animationiteration", function () {
    animal = (animal + 1) % 12;
    show(animal);
  });
  setInterval(function () {
    fetch("/healthz", { cache: "no-store" })
      .then(function (r) { if (r.ok) location.reload(); })
      .catch(function () {});

  }, 3000);
  // i18n — navigator.language 로 ko/en 분기
  var I18N = {
    ko: { title: '업데이트 <span class="accent">중</span>', pageTitle: '다굴 업데이트 중' },
    en: { title: 'Updating<span class="accent">...</span>', pageTitle: 'Dagul — Updating' },
    ja: { title: 'アップデート<span class="accent">中</span>', pageTitle: 'ダグル — アップデート中' },
    zh: { title: '更新<span class="accent">中</span>', pageTitle: '打群 — 更新中' }
  };
  var lang = (navigator.language || "ko").slice(0, 2).toLowerCase();
  var t = I18N[lang] || I18N.en;
  document.getElementById("title").innerHTML = t.title;
  document.getElementById("pageTitle").textContent = t.pageTitle;
  // 파비콘 — 아틀라스에서 올해 띠 셀을 canvas로 잘라 동적 교체
  var ATLAS_FRAME_FAV = [0, 1, 2, 3, 5, 4, 6, 7, 8, 9, 10, 11];
  var zodiacAnimal = ((new Date().getFullYear() - 4) % 12 + 12) % 12;
  var frameFav = ATLAS_FRAME_FAV[zodiacAnimal];
  var favImg = new Image();
  favImg.onload = function () {
    var cv = document.createElement("canvas");
    cv.width = 64; cv.height = 64;
    var cx = cv.getContext("2d");
    var cw = favImg.naturalWidth / 4, ch = favImg.naturalHeight / 3;
    cx.imageSmoothingEnabled = false;
    cx.drawImage(favImg, (frameFav % 4) * cw, Math.floor(frameFav / 4) * ch, cw, ch, 0, 0, 64, 64);
    var link = document.createElement("link");
    link.rel = "icon"; link.type = "image/png"; link.href = cv.toDataURL("image/png");
    document.head.appendChild(link);
  };
  // hero의 background-image는 CSS url(data:...) 형태 — 정규식으로 data URI를 추출
  var bgRaw = getComputedStyle(document.getElementById("hero")).backgroundImage;
  var m = bgRaw.match(/url\("?(data:[^"]+)"?\)/);
  if (m) favImg.src = m[1];
</script>
</body>
</html>
