name: Apps ship

# 개발자는 apps/ 만 푸시한다. 셀프호스트 러너가 Godot 웹·허브 이미지를 만들고, Helm 은 그 태그만 적용한다. 퍼지는 GitHub 호스트가 한다.
on:
  push:
    branches: [main, jeongright-gang-up-multi]
    paths:
      - "apps/**"
      - "deploy/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:
    inputs:
      all:
        description: "모든 슬롯"
        type: boolean
        default: true
      purge_only:
        description: "배포 없이 Cloudflare만 퍼지"
        type: boolean
        default: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
      helm: ${{ steps.list.outputs.helm }}
      empty: ${{ steps.list.outputs.empty }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ship contracts
        run: python3 deploy/scripts/test_ship_contracts.py
      - id: list
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.all }}" = "true" ]; then
              json=$(python3 deploy/scripts/ci-plan.py --all)
            else
              json=$(python3 deploy/scripts/ci-plan.py --changed "${{ github.event.before }}" "${{ github.sha }}")
            fi
          else
            json=$(python3 deploy/scripts/ci-plan.py --changed "${{ github.event.before }}" "${{ github.sha }}")
          fi
          echo "$json"
          folders=$(python3 -c "import json,sys; print(' '.join(json.loads(sys.argv[1]).get('folder', [])))" "$json")
          helm=$(python3 -c "import json,sys; print('true' if json.loads(sys.argv[1]).get('helm') else 'false')" "$json")
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
          echo "helm=$helm" >> "$GITHUB_OUTPUT"
          if [ -z "$folders" ] && [ "$helm" != "true" ]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          else
            echo "empty=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: plan
    if: ${{ needs.plan.outputs.folders != '' && github.event.inputs.purge_only != 'true' }}
    runs-on: [self-hosted, hackertone]
    timeout-minutes: 90
    concurrency:
      group: apps-build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Ship changed slots
        run: |
          set -eu
          python3 deploy/scripts/apply-apps.py ship ${{ needs.plan.outputs.folders }}

  helm:
    needs: [plan, build]
    if: >-
      always() &&
      !cancelled() &&
      needs.plan.result == 'success' &&
      github.event.inputs.purge_only != 'true' &&
      needs.plan.outputs.helm == 'true' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: [self-hosted, hackertone]
    timeout-minutes: 30
    concurrency:
      group: apps-helm
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Helm planted values
        run: python3 deploy/scripts/apply-apps.py helm --no-rebuild

  purge:
    needs: [plan, helm]
    if: ${{ always() && !cancelled() && (needs.helm.result == 'success' || github.event.inputs.purge_only == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python3 deploy/scripts/purge-cache.py
