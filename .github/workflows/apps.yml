name: Apps

# 푸시하면 바뀐 server-* 만 pve-hackertone 이 같은 잡에서 ship 하고 helm 한다.
on:
  push:
    branches: [main, jeongright-gang-up-multi]
    paths:
      - "apps/**"
      - "deploy/**"
      - ".github/workflows/apps.yml"
  workflow_dispatch:
    inputs:
      folders:
        description: "ship 할 폴더 (공백 구분, 예: dagul-prod). 비우면 ci-plan"
        type: string
        default: ""

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      folders: ${{ steps.list.outputs.folders }}
      helm: ${{ steps.list.outputs.helm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ship contracts
        run: python3 deploy/scripts/test_ship_contracts.py
      - id: list
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_FOLDERS: ${{ inputs.folders }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_FOLDERS:-}" ]; then
            json=$(python3 -c 'import json,os,re,sys; fs=[f for f in os.environ.get("INPUT_FOLDERS","").split() if f]; bad=next((f for f in fs if not re.fullmatch(r"(server|dagul)-[a-z0-9-]+", f)), ""); sys.exit("bad folder "+bad) if bad else print(json.dumps({"folder":fs,"helm":True}))')
          else
            json=$(python3 deploy/scripts/ci-plan.py --changed "${BEFORE:-}" "${SHA}")
          fi
          echo "$json"
          folders=$(python3 -c "import json,sys; print(' '.join(json.loads(sys.argv[1]).get('folder', [])))" "$json")
          helm=$(python3 -c "import json,sys; print('true' if json.loads(sys.argv[1]).get('helm') else 'false')" "$json")
          echo "folders=$folders" >> "$GITHUB_OUTPUT"
          echo "helm=$helm" >> "$GITHUB_OUTPUT"

  lint-web:
    needs: plan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck and lint shipped web
        run: python3 deploy/scripts/lint-web.py ${{ needs.plan.outputs.folders }}

  apply:
    needs: [plan, lint-web]
    if: ${{ needs.plan.outputs.folders != '' || needs.plan.outputs.helm == 'true' }}
    runs-on: [self-hosted, hackertone]
    timeout-minutes: 45
    concurrency:
      group: apps-ship
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Ship then helm on pve-hackertone
        env:
          FOLDERS: ${{ needs.plan.outputs.folders }}
          # 빈 GitHub 시크릿으로 러너의 CF_API_TOKEN 을 덮어쓰지 않는다.
          # 자격은 러너 환경(CF_API_TOKEN) 또는 /etc/hackertone/cloudflare.env.
        run: |
          set -eu
          if [ -n "${FOLDERS:-}" ]; then
            python3 deploy/scripts/apply-apps.py ship $FOLDERS
            export HACKERTONE_SHIP_FOLDERS="$FOLDERS"
          fi
          python3 deploy/scripts/apply-apps.py helm
