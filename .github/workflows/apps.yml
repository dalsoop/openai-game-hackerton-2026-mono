name: Cloudflare purge

# 빌드·Helm 은 로컬 정본이다. 푸시되면 캐시만 지운다.
on:
  push:
    branches: [main, jeongright-gang-up-multi]
    paths:
      - "apps/**"
      - "deploy/**"

jobs:
  purge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Purge Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: python3 deploy/scripts/purge-cache.py
