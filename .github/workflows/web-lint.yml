name: web-lint

# dagul-prod 웹 게이트 — 정적(lint·타입·스키마·단위).
# 브라우저 E2E는 로컬 담당(비용) · 배포는 apply-apps.py 가 담당한다.
on:
  pull_request:
    paths:
      - "apps/dagul-prod/web/**"
      - ".github/workflows/web-lint.yml"
  push:
    branches: [main]
    paths:
      - "apps/dagul-prod/web/**"

jobs:
  unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dagul-prod/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/dagul-prod/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx tsc --project tsconfig.server.json --noEmit
      - run: npm run lint
      - run: npm run schema:check
      - run: npx vitest run
