<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>다굴게임 Godot Graybox</title>
	<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
	color: #e8e6e1;
	background: #0b0e14;
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, sans-serif;
}
#canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }
#canvas:focus { outline: none; }
#loading {
	position: absolute; inset: 0; z-index: 20;
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	background: #0b0e14;
	transition: opacity 0.6s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loading-title {
	font-size: clamp(36px, 7vw, 64px);
	font-weight: 900;
	letter-spacing: -0.04em;
	color: #d4a843;
	margin-bottom: 8px;
}
.loading-sub { font-size: 14px; color: #7a8194; margin-bottom: 24px; }
.bar-track { width: min(320px, 80vw); height: 6px; background: #1a1f2a; border-radius: 3px; }
.bar-fill { height: 100%; width: 0; background: #d4a843; border-radius: 3px; transition: width 0.3s; }
.loading-pct { margin-top: 8px; font-size: 12px; color: #555; font-variant-numeric: tabular-nums; }
	</style>
</head>
<body>
	<div id="loading">
		<div class="loading-title">다굴즈</div>
		<div class="loading-sub">게임을 준비하는 중입니다</div>
		<div class="bar-track"><div class="bar-fill" id="bar"></div></div>
		<div class="loading-pct" id="pct"></div>
	</div>
	<canvas id="canvas"></canvas>
	<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>

	<script src="index.js"></script>
	<script>
	const bar = document.getElementById('bar');
	const pct = document.getElementById('pct');
	const loading = document.getElementById('loading');
	const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":219244628,"index.wasm":1508095},"focusCanvas":true,"gdextensionLibs":["libcolyseus_godot.web.wasm32.release.wasm"],"godotPoolSize":4};
	const engine = new Engine(GODOT_CONFIG);
	engine.setProgressFunc(function(current, total) {
		if (total > 0) {
			var p = Math.round(current / total * 100);
			bar.style.width = p + '%';
			pct.textContent = (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
		}
	});
	engine.startGame().then(function() {
		loading.classList.add('hidden');
	});
	</script>
</body>
</html>
