<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
	color: #e8e6e1;
	background: #0b0e14;
	overflow: hidden;
	touch-action: none;
	font-family: system-ui, sans-serif;
}
#canvas { display: block; position: absolute; top: 0; left: 0; z-index: 5; }
#canvas:focus { outline: none; }
#loading {
	position: absolute; inset: 0; z-index: 20;
	display: flex; flex-direction: column; align-items: center; justify-content: center;
	background: #0b0e14;
	transition: opacity 0.6s;
}
#loading.hidden { opacity: 0; pointer-events: none; }
.loading-title {
	font-size: clamp(36px, 7vw, 64px);
	font-weight: 900;
	letter-spacing: -0.04em;
	color: #d4a843;
	margin-bottom: 8px;
}
.loading-sub { font-size: 14px; color: #7a8194; margin-bottom: 24px; }
.bar-track { width: min(320px, 80vw); height: 6px; background: #1a1f2a; border-radius: 3px; }
.bar-fill { height: 100%; width: 0; background: #d4a843; border-radius: 3px; transition: width 0.3s; }
.loading-pct { margin-top: 8px; font-size: 12px; color: #555; font-variant-numeric: tabular-nums; }
	</style>
</head>
<body>
	<div id="loading">
		<div class="loading-title">다굴즈</div>
		<div class="loading-sub">게임을 준비하는 중입니다</div>
		<div class="bar-track"><div class="bar-fill" id="bar"></div></div>
		<div class="loading-pct" id="pct"></div>
	</div>
	<canvas id="canvas"></canvas>
	$GODOT_HEAD_INCLUDE
	<script>
	(function() {
		var orig = console.error;
		var W = window.__godotErrors = { groups: {}, firstAt: 0, total: 0, snapshot: null };
		function classify(args) {
			var s = Array.prototype.join.call(args, ' ');
			if (s.indexOf('_fp') >= 0 && s.indexOf('null') >= 0) return 'array_fp_null';
			if (s.indexOf('mem') >= 0 && s.indexOf('null') >= 0) return 'mem_null';
			if (s.indexOf('read-only') >= 0) return 'array_readonly';
			if (s.indexOf('alloc_static') >= 0) return 'alloc_static';
			return 'other';
		}
		function gameState() {
			try {
				var d = window.__dagulDebug || {};
				return { phase: d.phase || '', playerCount: d.playerCount || 0, rttMs: d.rttMs || 0, t: Date.now() };
			} catch(e) { return { t: Date.now() }; }
		}
		console.error = function() {
			var key = classify(arguments);
			var g = W.groups[key];
			if (!g) { g = W.groups[key] = { count: 0, first: null, lastLog: 0 }; }
			g.count++;
			W.total++;
			if (!g.first) {
				g.first = { args: Array.prototype.slice.call(arguments, 0, 2), state: gameState(), stack: new Error().stack?.split('\n').slice(0, 5) };
				if (!W.firstAt) { W.firstAt = Date.now(); W.snapshot = gameState(); }
			}
			var now = Date.now();
			if (now - g.lastLog > 3000) {
				g.lastLog = now;
				orig.call(console, '[engine:' + key + '] x' + g.count, arguments[0]);
			}
		};
		window.__godotErrorSummary = function() {
			orig.call(console, '=== Godot WASM Error Summary ===');
			orig.call(console, 'total:', W.total, 'first at:', W.firstAt ? new Date(W.firstAt).toISOString() : 'none');
			orig.call(console, 'snapshot:', JSON.stringify(W.snapshot));
			for (var k in W.groups) {
				var g = W.groups[k];
				orig.call(console, k + ':', g.count, 'times, first:', g.first);
			}
		};
	})();
	</script>
	<script src="$GODOT_URL"></script>
	<script>
	const bar = document.getElementById('bar');
	const pct = document.getElementById('pct');
	const loading = document.getElementById('loading');
	const GODOT_CONFIG = $GODOT_CONFIG;
	const engine = new Engine(GODOT_CONFIG);
	engine.setProgressFunc(function(current, total) {
		if (total > 0) {
			var p = Math.round(current / total * 100);
			bar.style.width = p + '%';
			pct.textContent = (current / 1048576).toFixed(1) + ' / ' + (total / 1048576).toFixed(1) + ' MB';
		}
	});
	engine.startGame().then(function() {
		loading.classList.add('hidden');
	});
	</script>
</body>
</html>
