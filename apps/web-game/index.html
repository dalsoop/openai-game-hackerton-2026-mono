<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>초갈 파티 레이스 · OpenAI Game Hackerton</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <header class="top">
        <h1>초갈 파티 레이스</h1>
        <p class="tag">OpenAI 게임 해커톤 · 관성 빡셈 · 로컬 2인 파티</p>
      </header>
      <div class="stage">
        <canvas id="game" width="960" height="540"></canvas>
        <div id="hud"></div>
        <div id="lobby" class="overlay">
          <div class="card">
            <h2>로비</h2>
            <p>P1: <kbd>WASD</kbd> · P2: <kbd>↑←↓→</kbd></p>
            <p class="warn">두 플레이어가 모두 준비해야 달릴 수 있습니다.</p>
            <div class="ready-row">
              <button type="button" id="ready1">P1 준비</button>
              <button type="button" id="ready2">P2 준비</button>
            </div>
            <button type="button" id="start" class="primary" disabled>레이스 시작</button>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
