<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gang-Up Monitor</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', sans-serif; background: #0f1117; color: #e1e4e8; padding: 16px; }
  h1 { font-size: 1.4rem; margin-bottom: 12px; color: #58a6ff; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; }
  .card.offline { opacity: 0.5; border-color: #f85149; }
  .card.online { border-color: #3fb950; }
  .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .card-title { font-size: 1rem; font-weight: 600; }
  .badge { font-size: 0.75rem; padding: 2px 8px; border-radius: 12px; font-weight: 500; }
  .badge.online { background: #238636; color: #fff; }
  .badge.offline { background: #da3633; color: #fff; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .stat { text-align: center; }
  .stat-value { font-size: 1.5rem; font-weight: 700; color: #58a6ff; }
  .stat-label { font-size: 0.7rem; color: #8b949e; text-transform: uppercase; }
  .ping-bar { margin-top: 12px; }
  .ping-row { display: flex; justify-content: space-between; font-size: 0.8rem; margin: 2px 0; }
  .ping-value { font-weight: 600; }
  .ping-good { color: #3fb950; }
  .ping-ok { color: #d29922; }
  .ping-bad { color: #f85149; }
  .rooms-section { margin-top: 10px; border-top: 1px solid #30363d; padding-top: 8px; }
  .room-chip { display: inline-block; font-size: 0.7rem; background: #21262d; border: 1px solid #30363d; border-radius: 4px; padding: 2px 6px; margin: 2px; }
  .room-chip.playing { border-color: #f0883e; color: #f0883e; }
  .room-chip.lobby { border-color: #58a6ff; color: #58a6ff; }
  .summary { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  .summary .stats { grid-template-columns: repeat(6, 1fr); }
  .updated { font-size: 0.7rem; color: #484f58; margin-top: 8px; text-align: right; }
  .player-list { margin-top: 8px; }
  .player-row { display: flex; justify-content: space-between; font-size: 0.75rem; padding: 1px 0; }
</style>
</head>
<body>
<h1>🎮 Gang-Up Server Monitor</h1>

<div class="summary" id="summary">
  <div class="stats">
    <div class="stat"><div class="stat-value" id="s-servers">-</div><div class="stat-label">Servers</div></div>
    <div class="stat"><div class="stat-value" id="s-online">-</div><div class="stat-label">Online</div></div>
    <div class="stat"><div class="stat-value" id="s-players">-</div><div class="stat-label">Players</div></div>
    <div class="stat"><div class="stat-value" id="s-playing">-</div><div class="stat-label">Playing</div></div>
    <div class="stat"><div class="stat-value" id="s-rooms">-</div><div class="stat-label">Rooms</div></div>
    <div class="stat"><div class="stat-value" id="s-avgping">-</div><div class="stat-label">Avg Ping</div></div>
  </div>
</div>

<div class="grid" id="grid"></div>
<div class="updated" id="updated"></div>

<script>
const SERVERS = [
  { name: 'server-yjh-dev1', url: 'https://server-yjh-dev1.external.kr' },
  { name: 'server-yjh-dev2', url: 'https://server-yjh-dev2.external.kr' },
  { name: 'server-yjh-dev3', url: 'https://server-yjh-dev3.external.kr' },
  { name: 'server-pjh-dev1', url: 'https://server-pjh-dev1.external.kr' },
  { name: 'server-pjh-dev2', url: 'https://server-pjh-dev2.external.kr' },
  { name: 'server-pjh-dev3', url: 'https://server-pjh-dev3.external.kr' },
  { name: 'server-pig-dev1', url: 'https://server-pig-dev1.external.kr' },
  { name: 'server-pig-dev2', url: 'https://server-pig-dev2.external.kr' },
  { name: 'server-pig-dev3', url: 'https://server-pig-dev3.external.kr' },
  { name: 'server-prod',     url: 'https://server-prod.external.kr' },
];

function pingClass(ms) {
  if (ms <= 50) return 'ping-good';
  if (ms <= 150) return 'ping-ok';
  return 'ping-bad';
}

function fmtUptime(s) {
  if (s < 60) return s + 's';
  if (s < 3600) return Math.floor(s / 60) + 'm';
  return Math.floor(s / 3600) + 'h ' + Math.floor((s % 3600) / 60) + 'm';
}

function renderCard(srv, data) {
  const online = !!data;
  const cls = online ? 'online' : 'offline';
  let inner = `<div class="card-header">
    <span class="card-title">${srv.name}</span>
    <span class="badge ${cls}">${online ? 'ONLINE' : 'OFFLINE'}</span>
  </div>`;

  if (!data) return `<div class="card ${cls}">${inner}<div style="color:#8b949e;font-size:0.85rem">연결 불가</div></div>`;

  inner += `<div class="stats">
    <div class="stat"><div class="stat-value">${data.clients.total}</div><div class="stat-label">접속</div></div>
    <div class="stat"><div class="stat-value">${data.clients.playing}</div><div class="stat-label">게임중</div></div>
    <div class="stat"><div class="stat-value">${fmtUptime(data.uptime)}</div><div class="stat-label">Uptime</div></div>
  </div>`;

  inner += `<div class="ping-bar">
    <div class="ping-row"><span>Avg</span><span class="ping-value ${pingClass(data.ping.avg)}">${data.ping.avg}ms</span></div>
    <div class="ping-row"><span>Min / Max</span><span class="ping-value">${data.ping.min}ms / ${data.ping.max}ms</span></div>
  </div>`;

  if (data.players.length > 0) {
    inner += '<div class="player-list">';
    for (const p of data.players) {
      inner += `<div class="player-row"><span>${p.name}</span><span class="${pingClass(p.rtt)}">${p.rtt}ms</span></div>`;
    }
    inner += '</div>';
  }

  if (data.rooms.length > 0) {
    inner += '<div class="rooms-section">';
    for (const r of data.rooms) {
      inner += `<span class="room-chip ${r.phase}">${r.title} (${r.playerCount}P, ${r.phase})</span>`;
    }
    inner += '</div>';
  }

  return `<div class="card ${cls}">${inner}</div>`;
}

async function fetchStatus(srv) {
  try {
    const r = await fetch(srv.url + '/gang-up/status', { signal: AbortSignal.timeout(2000) });
    if (!r.ok) return null;
    return await r.json();
  } catch { return null; }
}

async function refresh() {
  const results = await Promise.all(SERVERS.map(async (srv) => ({ srv, data: await fetchStatus(srv) })));
  const grid = document.getElementById('grid');
  grid.innerHTML = results.map(({ srv, data }) => renderCard(srv, data)).join('');

  const online = results.filter(r => r.data);
  document.getElementById('s-servers').textContent = SERVERS.length;
  document.getElementById('s-online').textContent = online.length;
  document.getElementById('s-players').textContent = online.reduce((s, r) => s + r.data.clients.total, 0);
  document.getElementById('s-playing').textContent = online.reduce((s, r) => s + r.data.clients.playing, 0);
  document.getElementById('s-rooms').textContent = online.reduce((s, r) => s + r.data.rooms.length, 0);
  const allPings = online.flatMap(r => r.data.players.map(p => p.rtt)).filter(r => r > 0);
  document.getElementById('s-avgping').textContent = allPings.length ? Math.round(allPings.reduce((a, b) => a + b, 0) / allPings.length) + 'ms' : '-';
  document.getElementById('updated').textContent = 'Updated: ' + new Date().toLocaleTimeString('ko-KR');
}

refresh();
setInterval(refresh, 10000);
</script>
</body>
</html>
