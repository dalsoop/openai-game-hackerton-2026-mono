<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>다굴 같이하기</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-0:#0b0e14; --bg-1:#12161f; --bg-2:#1a2029; --bg-3:#232b38;
      --line:#2a3342;
      --tx-0:#f2f5fa; --tx-1:#aeb8c9; --tx-2:#67728a;
      --acc:#ffd23e; --acc-dim:#b8931f;
      --cyan:#3ee6d2; --red:#ff5d5d; --green:#5dd97c;
      --p1:#ff5d5d; --p2:#4ea1ff; --p3:#5dd97c; --p4:#ffd23e;
      --p5:#c98bff; --p6:#ff9d4e; --p7:#3ee6d2; --p8:#ff7ab8;
      --radius:14px; --radius-s:8px;
      --shadow:0 8px 32px rgba(0,0,0,.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg-0); color: var(--tx-0); font-family: 'Pretendard Variable',Pretendard,-apple-system,'Noto Sans KR',ui-sans-serif,system-ui,sans-serif; font-size: 14px; line-height: 1.5; }

    /* --- background pattern --- */
    body::before { content:""; position:fixed; inset:0; z-index:-2; background: linear-gradient(rgba(11,14,20,0.85), rgba(11,14,20,0.92)), url('assets/lobby-bg.png') center/cover no-repeat, var(--bg-0); }
    body.wait::before { background: linear-gradient(rgba(11,14,20,0.82), rgba(11,14,20,0.90)), url('assets/waiting-bg.png') center/cover no-repeat, var(--bg-0); }
    body::after { content:""; position:fixed; inset:0; z-index:-1; opacity:.4; background-image:radial-gradient(circle, var(--line) 1px, transparent 1px); background-size:32px 32px; mask-image:linear-gradient(180deg,transparent,black 30%,black 70%,transparent); pointer-events:none; }

    /* --- canvas --- */
    canvas { display: none; width: 100vw; height: 100vh; background: var(--bg-0); }
    body.play canvas { display: block; }
    body.play #hub, body.play #wait, body.play #result { display: none !important; }

    /* --- sections --- */
    #hub, #wait { display:none; min-height: 100%; padding: 32px; max-width: 960px; margin: 0 auto; animation: fadeUp .35s ease both; }
    body:not(.play):not(.wait) #hub { display: block; }
    body.wait #hub { display: none; }
    body.wait #wait { display: block; }

    @keyframes fadeUp { from { opacity:0; transform:translateY(14px); } }
    @keyframes slotIn { from { transform:scale(.85); opacity:0; } }
    @keyframes pulse { 50% { opacity:.5; } }
    @keyframes riseIn { from { transform:translateY(30px) scale(.95); opacity:0; } }
    @keyframes float { 50% { transform:translateY(-6px); } }
    @keyframes toastIn { from { transform:translateX(120%); opacity:0; } }
    @keyframes toastOut { to { transform:translateX(120%); opacity:0; } }
    @keyframes curtainAnim { 0%{opacity:0} 20%,70%{opacity:1} 100%{opacity:0;visibility:hidden} }
    @media (prefers-reduced-motion:reduce) { *, *::before, *::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

    /* --- hero --- */
    .hero { display:flex; align-items:center; gap:16px; margin-bottom:28px; flex-wrap:wrap; }
    .logo-word { font-weight:900; font-size:clamp(28px,4vw,44px); letter-spacing:-.03em; color:var(--tx-0); }
    .logo-word span { color:var(--acc); margin-left:.3em; }
    .tagline { color:var(--tx-2); font-size:12px; letter-spacing:.15em; margin-top:2px; }

    /* --- connection status --- */
    .conn { display:flex; align-items:center; gap:8px; margin-left:auto; font-size:13px; color:var(--tx-1); }
    .conn-dot { width:8px; height:8px; border-radius:50%; background:var(--tx-2); flex-shrink:0; }
    .conn.ok .conn-dot { background:var(--green); box-shadow:0 0 8px var(--green); animation:pulse 2s infinite; }
    .conn.bad .conn-dot { background:var(--red); }
    .conn-ping { font-family:ui-monospace,monospace; font-size:12px; color:var(--cyan); }

    /* --- identity bar --- */
    .identity { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    .identity input { flex:1; max-width:220px; background:var(--bg-1); color:var(--tx-0); border:1.5px solid var(--line); border-radius:var(--radius); padding:10px 14px; font-size:15px; outline:none; transition:.2s; }
    .identity input:focus { border-color:var(--acc); }

    /* --- section titles --- */
    .sec-title { font-size:14px; font-weight:700; color:var(--tx-2); letter-spacing:.06em; text-transform:uppercase; margin:24px 0 12px; display:flex; align-items:center; gap:8px; }
    .count-badge { background:var(--bg-3); color:var(--tx-1); font-size:11px; padding:2px 8px; border-radius:10px; }

    /* --- mode cards --- */
    .modes { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px,1fr)); gap:10px; }
    .mode-card { position:relative; background:var(--bg-1); border:1.5px solid var(--line); border-radius:var(--radius); padding:14px; text-align:left; cursor:pointer; transition:transform .15s, border-color .15s, box-shadow .15s; }
    .mode-card:hover { transform:translateY(-3px); border-color:var(--tx-2); box-shadow:var(--shadow); }
    .mode-card.on { border-color:var(--acc); background:linear-gradient(160deg,rgba(255,210,62,.08),var(--bg-1)); }
    .mode-card b { display:block; font-size:15px; margin-bottom:4px; color:var(--tx-0); }
    .mode-card span { color:var(--tx-2); font-size:12px; line-height:1.4; }
    .mode-check { position:absolute; top:8px; right:8px; width:20px; height:20px; background:var(--acc); border-radius:50%; display:flex; align-items:center; justify-content:center; opacity:0; transform:scale(.5); transition:.2s; }
    .mode-card.on .mode-check { opacity:1; transform:scale(1); }

    /* --- room list --- */
    .rooms { display:flex; flex-direction:column; gap:8px; }
    .room-card { background:var(--bg-1); border:1.5px solid var(--line); border-radius:var(--radius); padding:14px 16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:.15s; }
    .room-card:hover { border-color:var(--cyan); transform:translateY(-1px); box-shadow:var(--shadow); }
    .room-info { flex:1; min-width:0; }
    .room-info b { font-size:15px; display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .room-mode-badge { font-size:11px; color:var(--acc); background:rgba(255,210,62,.1); padding:2px 8px; border-radius:6px; white-space:nowrap; }
    .room-pips { display:flex; gap:3px; margin-top:6px; }
    .room-pips i { width:10px; height:14px; border-radius:3px; background:var(--bg-3); display:block; }
    .room-count { font-size:13px; color:var(--tx-1); white-space:nowrap; }
    .room-enter { font-size:12px; color:var(--cyan); white-space:nowrap; }
    .empty-rooms { color:var(--tx-2); font-size:13px; padding:20px 0; text-align:center; }

    /* --- CTA button --- */
    .cta { background:var(--acc); color:var(--bg-0); font-weight:800; font-size:15px; border:0; border-radius:var(--radius); padding:12px 24px; cursor:pointer; transition:.15s; margin-top:20px; }
    .cta:hover { filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 6px 20px rgba(255,210,62,.35); }
    .cta small { font-weight:500; opacity:.7; margin-left:6px; }

    /* --- ghost/danger buttons --- */
    .ghost { background:var(--bg-1); color:var(--tx-1); border:1.5px solid var(--line); border-radius:var(--radius); padding:8px 16px; font-size:13px; cursor:pointer; transition:.15s; }
    .ghost:hover { border-color:var(--tx-2); }
    .ghost.danger { color:var(--red); border-color:var(--red); }
    .ghost.danger:hover { background:rgba(255,93,93,.1); }

    /* --- wait header --- */
    .wait-head { display:flex; align-items:center; gap:12px; margin-bottom:20px; flex-wrap:wrap; }
    .wait-head h1 { font-size:22px; flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .wait-mode { font-size:12px; color:var(--acc); background:rgba(255,210,62,.12); padding:3px 10px; border-radius:8px; }

    /* --- wait grid (slots + chat) --- */
    .wait-grid { display:grid; grid-template-columns:1fr 280px; gap:16px; }
    @media (max-width:720px) { .wait-grid { grid-template-columns:1fr; } }

    /* --- slot cards --- */
    .slots { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
    @media (max-width:640px) { .slots { grid-template-columns:repeat(2,1fr); } }
    .slot-card { background:var(--bg-1); border:1.5px dashed var(--line); border-radius:var(--radius); padding:12px 8px; text-align:center; min-height:120px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; transition:.25s; }
    .slot-card.filled { border-style:solid; animation:slotIn .35s cubic-bezier(.2,1.4,.4,1); }
    .slot-card.me { box-shadow:0 0 0 2px var(--cyan) inset; }
    .slot-card:not(.filled) { opacity:.5; }
    .slot-name { font-size:14px; font-weight:600; margin-top:4px; }
    .slot-tag { font-size:11px; color:var(--tx-2); }
    .slot-crown { display:inline; }
    .slot-cpu { color:var(--tx-2); font-size:12px; }

    /* --- invite row --- */
    .invite-row { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; }
    .invite-row input { flex:1; min-width:200px; background:var(--bg-1); color:var(--tx-1); border:1.5px solid var(--line); border-radius:var(--radius); padding:8px 12px; font-size:12px; outline:none; }
    .invite-row button { font-size:12px; }

    /* --- chat --- */
    .chat-box { display:flex; flex-direction:column; background:var(--bg-1); border:1.5px solid var(--line); border-radius:var(--radius); min-height:280px; max-height:400px; overflow:hidden; }
    .chat-log { flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:4px; font-size:13px; }
    .chat-msg b { margin-right:6px; }
    .chat-msg.sys { color:var(--tx-2); font-style:italic; font-size:12px; }
    .chat-form { display:flex; border-top:1px solid var(--line); }
    .chat-form input { flex:1; background:transparent; color:var(--tx-0); border:0; padding:10px 12px; font-size:13px; outline:none; }
    .chat-form button { background:var(--acc); color:var(--bg-0); border:0; padding:8px 14px; font-size:12px; font-weight:700; cursor:pointer; }

    /* --- host bar --- */
    .host-bar { display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
    .host-bar select { background:var(--bg-1); color:var(--tx-0); border:1.5px solid var(--line); border-radius:var(--radius-s); padding:8px 12px; font-size:13px; }

    /* --- result overlay --- */
    #result { display:none; position:fixed; inset:0; place-items:center; background: linear-gradient(rgba(11,14,20,0.85), rgba(11,14,20,0.88)), url('assets/victory-bg.png') center/cover no-repeat; backdrop-filter:blur(6px); z-index:40; }
    #result.show { display:grid; }
    .result-card { width:min(540px,92vw); background:var(--bg-1); border:1px solid var(--line); border-radius:20px; padding:28px; animation:riseIn .4s cubic-bezier(.2,1.2,.3,1); text-align:center; }
    .result-banner { font-size:36px; font-weight:900; letter-spacing:.1em; color:var(--acc); text-shadow:0 0 30px rgba(255,210,62,.3); margin-bottom:16px; }
    .result-banner.draw { color:var(--cyan); text-shadow:0 0 30px rgba(62,230,210,.3); }
    .winner-box { margin:16px 0; }
    .winner-avatar { animation:float 3s ease-in-out infinite; display:inline-block; }
    .winner-name { font-size:22px; font-weight:800; margin-top:8px; }
    .winner-kills { font-size:14px; color:var(--tx-1); margin-top:4px; }
    .scoreboard { width:100%; border-collapse:collapse; margin:20px 0; font-size:13px; text-align:left; }
    .scoreboard th { color:var(--tx-2); font-weight:600; font-size:11px; letter-spacing:.05em; text-transform:uppercase; padding:6px 8px; border-bottom:1px solid var(--line); }
    .scoreboard td { padding:6px 8px; border-bottom:1px solid var(--line); }
    .scoreboard tr.top { background:rgba(255,210,62,.07); }
    .scoreboard .rank { color:var(--tx-2); font-family:ui-monospace,monospace; }
    .scoreboard .dead { opacity:.45; }
    .result-actions { display:flex; gap:10px; justify-content:center; margin-top:8px; }

    /* --- toasts --- */
    .toasts { position:fixed; bottom:20px; right:20px; display:flex; flex-direction:column; gap:8px; z-index:70; pointer-events:none; }
    .toast { background:var(--bg-2); border:1px solid var(--line); border-left:3px solid var(--acc); border-radius:var(--radius-s); padding:10px 14px; font-size:13px; box-shadow:var(--shadow); animation:toastIn .25s cubic-bezier(.2,1.3,.4,1); pointer-events:auto; }
    .toast.leave { border-left-color:var(--red); }
    .toast.out { animation:toastOut .3s both; }

    /* --- curtain --- */
    #curtain { position:fixed; inset:0; background:var(--bg-0); z-index:60; pointer-events:none; opacity:0; visibility:hidden; }
    #curtain.go { animation:curtainAnim .8s both; }

    /* --- reconnect banner --- */
    .reconnect-banner { position:fixed; top:0; left:0; width:100%; padding:10px; background:rgba(255,93,93,.92); color:#fff; text-align:center; font-size:14px; font-weight:600; z-index:9999; }
  </style>
</head>
<body>
  <canvas id="c" width="1600" height="900"></canvas>

  <!-- === LOBBY === -->
  <section id="hub">
    <header class="hero">
      <img src="assets/logo.png" width="56" height="56" alt="dagul" style="border-radius:8px" />
      <div>
        <div class="logo-word">다굴<span>같이하기</span></div>
        <div class="tagline">8명 &middot; 한 판 &middot; 마지막 한 명</div>
      </div>
      <div class="conn" id="connStatus">
        <span class="conn-dot"></span>
        <span class="conn-txt" id="status">서버 연결 중&hellip;</span>
        <span class="conn-ping" id="pingDisplay"></span>
      </div>
    </header>

    <div class="identity">
      <div id="avatarPreview"></div>
      <input id="name" maxlength="12" placeholder="내 이름" />
    </div>

    <div class="sec-title">모드 선택</div>
    <div class="modes" id="modes"></div>

    <div class="sec-title">열린 방 <span class="count-badge" id="roomCount">0</span></div>
    <div class="rooms" id="rooms"></div>

    <button class="cta" id="createRoom">방 만들기</button>
  </section>

  <!-- === WAITING ROOM === -->
  <section id="wait">
    <header class="wait-head">
      <span class="wait-mode" id="waitMode"></span>
      <h1 id="waitTitle">대기실</h1>
      <button class="ghost danger" id="leave">나가기</button>
    </header>

    <div class="wait-grid">
      <div>
        <div class="slots" id="slots"></div>
        <div class="invite-row">
          <input id="invite" readonly />
          <button class="ghost" id="copy">링크 복사</button>
          <button class="ghost" id="shareBtn" style="display:none">공유</button>
        </div>
      </div>
      <div class="chat-box">
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" maxlength="120" placeholder="채팅..." autocomplete="off" />
          <button type="submit">전송</button>
        </form>
      </div>
    </div>

    <div class="host-bar" id="hostBar" style="display:none">
      <select id="modeChange"></select>
      <button class="cta" id="start">같이 시작<small>빈자리 CPU</small></button>
    </div>
  </section>

  <!-- === RESULT OVERLAY === -->
  <div id="result">
    <div class="result-card">
      <div class="result-banner" id="resultBanner"></div>
      <div class="winner-box" id="winnerBox"></div>
      <table class="scoreboard">
        <thead><tr><th>#</th><th>플레이어</th><th>킬</th><th>상태</th></tr></thead>
        <tbody id="scoreRows"></tbody>
      </table>
      <div class="result-actions">
        <button class="cta" id="resultLobby">로비로</button>
      </div>
    </div>
  </div>

  <!-- === TOASTS === -->
  <div class="toasts" id="toasts"></div>

  <!-- === CURTAIN === -->
  <div id="curtain"></div>

<script>
/* ===================== CONSTANTS ===================== */
const CANVAS_W = 1600;
const CANVAS_H = 900;

const NET = {
  INTERP_MS: 100,
  SNAP_BUF_MAX: 16,
  PING_INTERVAL_MS: 5000,
  INPUT_INTERVAL_MS: 50,
  RECONNECT_BASE_MS: 500,
  RECONNECT_MAX_MS: 30000,
  RECONNECT_JITTER_MS: 250,
  PING_UPDATE_INTERVAL_MS: 2000,
};

const MODE_TITLES = {
  classic: "클래식",
  "gun-semi": "무기 · 단발",
  "gun-auto": "무기 · 연발",
  item: "아이템",
  full: "합본",
};

const HUD = {
  canvasBg: "#0b0e13",
  bg: "rgba(8,10,14,0.85)",
  text: "#fff",
  textMuted: "#aebaca",
  hpBar: "#6ef3a5",
  hpBarBg: "#000",
  pingGood: "#3fb950",
  pingOk: "#d29922",
  pingBad: "#f85149",
  arenaWater: "#123047",
  arenaGround: "#c4a574",
  zoneShrink: "#ff4f68",
  zoneIdle: "#70e7ff",
  lootGun: "#ffd166",
  lootItem: "#6ef3a5",
  bullet: "#ffe066",
};

const MAX_PLAYERS = 8;

/* ===================== VISUAL ASSETS ===================== */
const PLAYER_COLORS = ['var(--p1)','var(--p2)','var(--p3)','var(--p4)','var(--p5)','var(--p6)','var(--p7)','var(--p8)'];
const AVATAR_SHAPES = [
  '<circle cx="16" cy="13" r="8"/>',
  '<rect x="8" y="5" width="16" height="16" rx="3"/>',
  '<path d="M16 4 L25 20 L7 20 Z"/>',
  '<path d="M16 4 L26 13 L16 22 L6 13 Z"/>',
  '<path d="M16 4 L25 10 L22 21 L10 21 L7 10 Z"/>',
  '<path d="M16 4 L24 8 L24 18 L16 22 L8 18 L8 8 Z"/>',
  '<path d="M16 3 L19 11 L27 11 L21 16 L23 24 L16 19 L9 24 L11 16 L5 11 L13 11 Z"/>',
  '<path d="M8 20 A8 8 0 1 1 24 20 L24 14 A8 8 0 0 0 8 14 Z"/>',
];
function avatarSVG(i, size=32) {
  const idx = ((i % 8) + 8) % 8;
  return `<svg viewBox="0 0 32 32" width="${size}" height="${size}"><g fill="${PLAYER_COLORS[idx]}">${AVATAR_SHAPES[idx]}</g><rect x="9" y="23" width="14" height="5" rx="2.5" fill="${PLAYER_COLORS[idx]}" opacity=".55"/></svg>`;
}
const CROWN_SVG = '<svg viewBox="0 0 16 12" width="14" height="10" style="vertical-align:middle;margin-right:2px"><path d="M1 11 h14 L14 3 L10.5 6.5 L8 1 L5.5 6.5 L2 3 Z" fill="var(--acc)"/></svg>';

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const proto = location.protocol === "https:" ? "wss" : "ws";
const wsPath = location.pathname.replace(/\/[^/]*$/, "") || "";
const params = new URLSearchParams(location.search);
let modes = {};
let rooms = [];
let players = [];
let you = 0;
let myId = "";
let phase = "hub";
let selectedMode = params.get("mode") || "classic";
let roomInfo = null;
let snap = null;
const snapBuf = [];
let keys = {};
let mouse = { x: CANVAS_W / 2, y: CANVAS_H / 2, down: false };
let myPing = 0;
let resultShown = false;
const nameIn = document.getElementById("name");
nameIn.value = params.get("name") || ("웹" + Math.floor(10 + Math.random() * 89));

let ws = null;
let reconnectAttempt = 0;
let intentionalClose = false;
let resumeToken = sessionStorage.getItem("gangup.resume") || "";
let welcomed = false;

const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function send(msg) {
  if (ws && ws.readyState === 1) ws.send(JSON.stringify(msg));
}

function setPhase(next) {
  phase = next;
  document.body.className = next === "play" ? "play" : next === "wait" ? "wait" : "";
  if (next === "play") {
    resultShown = false;
    document.getElementById("result").classList.remove("show");
    const c = document.getElementById("curtain");
    c.classList.remove("go");
    void c.offsetWidth;
    c.classList.add("go");
  }
}

let wantResume = false;
function hello() {
  send({ t: "hello", name: nameIn.value || "웹", mode: selectedMode, resume: resumeToken, wantResume });
  send({ t: "rooms" });
  wantResume = false;
}

/* --- toast --- */
function toast(msg, kind='') {
  const el = document.createElement('div');
  el.className = 'toast ' + kind;
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 300); }, 3200);
}

/* --- banner --- */
function showBanner(text) {
  const conn = document.getElementById("connStatus");
  conn.className = "conn bad";
  document.getElementById("status").textContent = text;
  let el = document.getElementById("reconnect-banner");
  if (!el) {
    el = document.createElement("div");
    el.id = "reconnect-banner";
    el.className = "reconnect-banner";
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.display = "block";
}

function hideBanner() {
  const el = document.getElementById("reconnect-banner");
  if (el) el.style.display = "none";
  const conn = document.getElementById("connStatus");
  conn.className = "conn ok";
  updatePingDisplay();
}

function updatePingDisplay() {
  const st = document.getElementById("status");
  const pd = document.getElementById("pingDisplay");
  st.textContent = "접속됨";
  pd.textContent = myPing > 0 ? myPing + "ms" : "";
}

/* --- chat --- */
function addChat(name, text, slot, sys) {
  const log = document.getElementById("chatLog");
  const div = document.createElement("div");
  div.className = sys ? "chat-msg sys" : "chat-msg";
  if (sys) {
    div.textContent = text;
  } else {
    div.innerHTML = `<b style="color:${PLAYER_COLORS[slot % 8]}">${esc(name)}</b>${esc(text)}`;
  }
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

/* --- connect --- */
function connect() {
  ws = new WebSocket(`${proto}://${location.host}${wsPath}`);
  ws.onopen = () => {
    wantResume = reconnectAttempt > 0;
    reconnectAttempt = 0;
    hideBanner();
  };
  ws.onmessage = onMessage;
  ws.onclose = () => {
    if (intentionalClose) return;
    showBanner(`연결이 끊겼습니다. 다시 연결하는 중… (${reconnectAttempt + 1}번째 시도)`);
    const delay = Math.min(NET.RECONNECT_BASE_MS * Math.pow(2, reconnectAttempt) + Math.random() * NET.RECONNECT_JITTER_MS, NET.RECONNECT_MAX_MS);
    reconnectAttempt++;
    setTimeout(connect, delay);
  };
  ws.onerror = () => {};
}

window.addEventListener("beforeunload", () => { intentionalClose = true; });

function storeToken(token) {
  if (token) { resumeToken = token; sessionStorage.setItem("gangup.resume", resumeToken); }
}

function resetRoom() {
  players = []; roomInfo = null; snap = null; snapBuf.length = 0;
  resultShown = false;
  document.getElementById("result").classList.remove("show");
  history.replaceState({}, "", `?mode=${encodeURIComponent(selectedMode)}`);
}

const msgHandlers = {
  welcome(msg) {
    if (msg.id) myId = msg.id;
    const prevToken = resumeToken;
    storeToken(msg.resume);
    modes = msg.modes || {};
    if (!welcomed) {
      welcomed = true;
      setInterval(() => {
        if (myPing > 0 && !document.getElementById("reconnect-banner")?.style.display?.includes("block")) {
          updatePingDisplay();
        }
      }, NET.PING_UPDATE_INTERVAL_MS);
      const roomId = params.get("room");
      if (roomId) setTimeout(() => send({ t: "join", roomId }), 80);
    }
    hideBanner();
    renderModes();
    send({ t: "hello", name: nameIn.value || "웹", mode: selectedMode, resume: prevToken, wantResume: !!prevToken && wantResume });
    send({ t: "rooms" });
  },
  resume(msg) {
    if (msg.id) myId = msg.id;
    you = msg.you;
    players = msg.players || [];
    roomInfo = msg.room;
    snapBuf.length = 0;
    storeToken(msg.resume);
    if (msg.playing) {
      if (msg.snap) { snap = msg.snap; snapBuf.push({ at: performance.now(), snap: msg.snap }); }
      setPhase("play");
    } else {
      setPhase("wait"); renderWait();
    }
    hideBanner();
  },
  dropped(msg) {
    storeToken(msg.resume);
    setPhase("hub"); hello();
  },
  kicked(msg) {
    resetRoom();
    setPhase("hub"); hello();
    toast(msg.msg || "방에서 내보내졌습니다.", "leave");
  },
  lobby() {
    snap = null; snapBuf.length = 0; resultShown = false;
    document.getElementById("result").classList.remove("show");
    setPhase("wait"); renderWait();
  },
  rooms(msg) { rooms = msg.rooms || []; renderRooms(); },
  joined(msg) {
    you = msg.you;
    players = msg.players || [];
    roomInfo = msg.room;
    selectedMode = msg.room.mode;
    history.replaceState({}, "", `?mode=${encodeURIComponent(selectedMode)}&room=${encodeURIComponent(msg.room.id)}`);
    document.getElementById("chatLog").innerHTML = "";
    setPhase("wait"); renderWait();
  },
  peers(msg) {
    players = msg.players || [];
    if (msg.room) roomInfo = msg.room;
    const me = players.find(p => p.id === myId);
    if (me) you = me.slot;
    if (msg.notice) addChat("", msg.notice, 0, true);
    renderWait();
  },
  chat(msg) { addChat(msg.from, msg.text, msg.slot, false); },
  start(msg) { you = msg.you; setPhase("play"); },
  snap(msg) {
    snap = msg;
    snapBuf.push({ at: performance.now(), snap: msg });
    while (snapBuf.length > NET.SNAP_BUF_MAX) snapBuf.shift();
    if (msg.result !== "playing") document.body.className = "play";
    if (phase !== "play") setPhase("play");
    if (msg.result && msg.result !== "playing" && !resultShown) {
      resultShown = true; showResult(msg);
    }
  },
  left() { resetRoom(); setPhase("hub"); hello(); },
  error(msg) { toast(msg.msg, "leave"); },
};

function onMessage(ev) {
  const msg = JSON.parse(ev.data);
  if (msg.t === "ping") { send({ t: "pong", ts: msg.ts }); return; }
  if (msg.t === "pong") { if (typeof msg.ts === "number") myPing = Date.now() - msg.ts; return; }
  const handler = msgHandlers[msg.t];
  if (handler) handler(msg);
}

/* ===================== RENDER FUNCTIONS ===================== */

function renderModes() {
  const el = document.getElementById("modes");
  el.innerHTML = Object.values(modes).map(m =>
    `<button class="mode-card ${m.id === selectedMode ? "on" : ""}" data-id="${esc(m.id)}">
      <b>${esc(m.title)}</b><span>${esc(m.blurb)}</span>
      <div class="mode-check"><svg viewBox="0 0 20 20" width="14"><path d="M4 10 l4 4 l8-8" stroke="var(--bg-0)" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg></div>
    </button>`
  ).join("");
  el.querySelectorAll(".mode-card").forEach(btn => {
    btn.onclick = () => {
      selectedMode = btn.dataset.id;
      renderModes();
    };
  });
  renderModeSelect();
}

function renderModeSelect() {
  const sel = document.getElementById("modeChange");
  sel.innerHTML = Object.values(modes).map(m =>
    `<option value="${esc(m.id)}" ${m.id === selectedMode ? "selected" : ""}>${esc(m.title)}</option>`
  ).join("");
}

function renderRooms() {
  const titles = MODE_TITLES;
  document.getElementById("roomCount").textContent = rooms.length;
  const el = document.getElementById("rooms");
  if (!rooms.length) {
    el.innerHTML = `<div class="empty-rooms">아직 열린 방이 없습니다. 모드를 골라 방을 만들어보세요.</div>`;
    return;
  }
  el.innerHTML = rooms.map(r => {
    let pips = '';
    for (let i = 0; i < MAX_PLAYERS; i++) pips += `<i${i < r.count ? ` style="background:${PLAYER_COLORS[i]}"` : ''}></i>`;
    return `<div class="room-card" data-id="${esc(r.id)}">
      <div class="room-info"><b>${esc(r.title)}</b><div class="room-pips">${pips}</div></div>
      <span class="room-mode-badge">${esc(titles[r.mode] || r.mode)}</span>
      <span class="room-count">${r.count}/${MAX_PLAYERS}</span>
      <span class="room-enter">입장 →</span>
    </div>`;
  }).join("");
  el.querySelectorAll(".room-card[data-id]").forEach(c => c.onclick = () => send({ t: "join", roomId: c.dataset.id }));
}

function renderWait() {
  const titles = MODE_TITLES;
  const modeName = titles[roomInfo?.mode] || "";
  document.getElementById("waitTitle").textContent = roomInfo?.title || "대기실";
  document.getElementById("waitMode").textContent = modeName;
  document.getElementById("invite").value = location.href;

  const amHost = players.some(p => p.id === myId && p.host);
  const hostBar = document.getElementById("hostBar");
  hostBar.style.display = amHost ? "flex" : "none";

  if (navigator.share) {
    const sb = document.getElementById("shareBtn");
    sb.style.display = "inline-block";
    sb.onclick = () => navigator.share({ title: '다굴 같이하기', url: location.href });
  }

  const cells = [];
  for (let i = 0; i < MAX_PLAYERS; i++) {
    const p = players.find(x => x.slot === i);
    if (p) {
      const isMe = p.id === myId;
      cells.push(`<div class="slot-card filled${p.host ? ' host' : ''}${isMe ? ' me' : ''}" style="border-color:${PLAYER_COLORS[i]}">
        ${avatarSVG(i, 40)}
        <div class="slot-name">${esc(p.name)}</div>
        <div class="slot-tag">${p.host ? CROWN_SVG + '호스트 \xb7 ' : ''}P${i+1}${isMe ? ' \xb7 나' : ''}${p.dropped ? ' \xb7 끌김' : ''}</div>
      </div>`);
    } else {
      cells.push(`<div class="slot-card">
        ${avatarSVG(i, 40)}
        <div class="slot-cpu">빈자리</div>
        <div class="slot-tag">시작 시 CPU</div>
      </div>`);
    }
  }
  document.getElementById("slots").innerHTML = cells.join("");
}

function showResult(snapData) {
  const r = document.getElementById("result");
  const banner = document.getElementById("resultBanner");
  const winnerBox = document.getElementById("winnerBox");
  const rows = document.getElementById("scoreRows");

  const isDraw = snapData.winner < 0;
  banner.textContent = isDraw ? "무승부" : "VICTORY";
  banner.className = "result-banner" + (isDraw ? " draw" : "");

  if (!isDraw) {
    const w = snapData.players[snapData.winner];
    winnerBox.innerHTML = `<div class="winner-avatar">${avatarSVG(w.slot, 80)}</div>
      <div class="winner-name">${esc(w.name)}</div>
      <div class="winner-kills">${w.kills} 킬</div>`;
  } else {
    winnerBox.innerHTML = "";
  }

  const sorted = [...snapData.players].sort((a,b) => {
    if (a.alive !== b.alive) return a.alive ? -1 : 1;
    return b.kills - a.kills;
  });
  rows.innerHTML = sorted.map((p, i) =>
    `<tr class="${p.slot === snapData.winner ? 'top' : ''}${p.alive ? '' : ' dead'}">
      <td class="rank">${i+1}</td>
      <td>${avatarSVG(p.slot,20)} ${esc(p.name)}</td>
      <td>${p.kills}</td>
      <td>${p.alive ? '생존' : '탈락'}</td>
    </tr>`
  ).join("");

  r.classList.add("show");
}

/* ===================== EVENT BINDINGS ===================== */

nameIn.onchange = () => {
  document.getElementById("avatarPreview").innerHTML = avatarSVG(0, 44);
  hello();
};

document.getElementById("createRoom").onclick = () => {
  hello();
  send({ t: "create" });
};

document.getElementById("copy").onclick = async () => {
  const url = document.getElementById("invite").value;
  try {
    await navigator.clipboard.writeText(url);
    toast("초대 링크가 복사되었습니다.");
  } catch { document.getElementById("invite").select(); }
};

document.getElementById("leave").onclick = () => send({ t: "leave" });
document.getElementById("start").onclick = () => send({ t: "start" });

document.getElementById("modeChange").onchange = (e) => {
  send({ t: "mode", mode: e.target.value });
};

document.getElementById("chatForm").onsubmit = (e) => {
  e.preventDefault();
  const inp = document.getElementById("chatInput");
  const text = inp.value.trim();
  if (!text) return;
  send({ t: "chat", text });
  inp.value = "";
};

document.getElementById("resultLobby").onclick = () => {
  send({ t: "leave" });
};

window.addEventListener("keydown", e => {
  keys[e.code] = true;
  if (e.code === "Escape" && phase === "play") send({ t: "leave" });
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * canvas.width / r.width;
  mouse.y = (e.clientY - r.top) * canvas.height / r.height;
});
canvas.addEventListener("mousedown", () => mouse.down = true);
window.addEventListener("mouseup", () => mouse.down = false);

setInterval(() => {
  if (phase !== "play") return;
  send({
    t: "input",
    mx: (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0),
    my: (keys.KeyS||keys.ArrowDown?1:0) - (keys.KeyW||keys.ArrowUp?1:0),
    fire: mouse.down,
    dash: !!keys.Space,
    use: !!keys.KeyE,
    aimX: mouse.x,
    aimY: mouse.y,
  });
}, NET.INPUT_INTERVAL_MS);

setInterval(() => { send({ t: "ping", ts: Date.now() }); }, NET.PING_INTERVAL_MS);

/* ===================== CANVAS RENDERING (PRESERVED) ===================== */

function viewSnap() {
  if (snapBuf.length === 0) return snap;
  if (snapBuf.length === 1) return snapBuf[0].snap;
  const renderAt = performance.now() - NET.INTERP_MS;
  let a = snapBuf[0];
  let b = snapBuf[snapBuf.length - 1];
  for (let i = 0; i < snapBuf.length - 1; i++) {
    if (snapBuf[i + 1].at >= renderAt) {
      a = snapBuf[i];
      b = snapBuf[i + 1];
      break;
    }
  }
  const span = Math.max(1, b.at - a.at);
  const t = Math.max(0, Math.min(1, (renderAt - a.at) / span));
  const as = a.snap;
  const bs = b.snap;
  const mix = (p, q, k) => p + (q - p) * k;
  const aPlayers = as.players || [];
  const bPlayers = bs.players || [];
  const playersView = bPlayers.map((bp) => {
    const ap = aPlayers.find((x) => x.slot === bp.slot) || bp;
    return { ...bp, x: mix(ap.x, bp.x, t), y: mix(ap.y, bp.y, t), aimX: mix(ap.aimX, bp.aimX, t), aimY: mix(ap.aimY, bp.aimY, t) };
  });
  const aBullets = as.bullets || [];
  const bBullets = bs.bullets || [];
  const bullets = aBullets.length === bBullets.length
    ? bBullets.map((bb, i) => ({ ...bb, x: mix(aBullets[i].x, bb.x, t), y: mix(aBullets[i].y, bb.y, t) }))
    : bBullets;
  return { ...bs, zoneR: mix(as.zoneR || 420, bs.zoneR || 420, t), players: playersView, bullets };
}

function pingColor(ms) {
  if (ms <= 50) return HUD.pingGood;
  if (ms <= 150) return HUD.pingOk;
  return HUD.pingBad;
}

function drawWorld(view) {
  const cx = CANVAS_W / 2, cy = CANVAS_H / 2;
  ctx.fillStyle = HUD.canvasBg; ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);
  const zoneR = view.zoneR || 420;
  ctx.beginPath(); ctx.arc(cx, cy, 430, 0, Math.PI * 2); ctx.fillStyle = HUD.arenaWater; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, zoneR, 0, Math.PI * 2); ctx.fillStyle = HUD.arenaGround; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, zoneR, 0, Math.PI * 2); ctx.strokeStyle = view.shrinking ? HUD.zoneShrink : HUD.zoneIdle; ctx.lineWidth = 4; ctx.stroke();
  for (const drop of view.loot || []) {
    ctx.beginPath(); ctx.arc(drop.x, drop.y, 8, 0, Math.PI * 2);
    ctx.fillStyle = drop.kind === "gun" ? HUD.lootGun : HUD.lootItem; ctx.fill();
  }
  for (const b of view.bullets || []) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fillStyle = HUD.bullet; ctx.fill();
  }
}

function drawPlayers(view) {
  let me = null, alive = 0;
  for (const p of view.players || []) {
    if (p.alive) alive++;
    ctx.globalAlpha = p.alive ? 1 : 0.25;
    ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, Math.PI * 2); ctx.fillStyle = p.color || HUD.text; ctx.fill();
    if (p.slot === you) { me = p; ctx.strokeStyle = HUD.text; ctx.lineWidth = 2; ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle = HUD.text; ctx.font = "12px sans-serif"; ctx.textAlign = "center";
    ctx.fillText(p.name, p.x, p.y - 24);
    ctx.fillStyle = HUD.hpBarBg; ctx.fillRect(p.x - 18, p.y + 20, 36, 5);
    ctx.fillStyle = HUD.hpBar; ctx.fillRect(p.x - 18, p.y + 20, 36 * Math.max(0, p.hp / 100), 5);
  }
  return { me, alive };
}

function drawHUD(me, alive) {
  ctx.fillStyle = HUD.bg; ctx.fillRect(16, 16, 460, 70);
  ctx.fillStyle = HUD.text; ctx.font = "18px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(`생존 ${alive}/${MAX_PLAYERS}   킬 ${me?.kills || 0}   ${me?.weapon || ""}`, 28, 44);
  ctx.fillStyle = HUD.textMuted; ctx.font = "14px sans-serif";
  ctx.fillText(`아이템 ${me?.item || "-"}   WASD 클릭사격  SPACE대시  E아이템  ESC로비`, 28, 68);
}

function drawPing() {
  ctx.fillStyle = HUD.bg; ctx.fillRect(CANVAS_W - 140, 16, 124, 32);
  ctx.fillStyle = pingColor(myPing); ctx.font = "bold 16px sans-serif"; ctx.textAlign = "right";
  ctx.fillText(`${myPing}ms`, CANVAS_W - 28, 38);
}

function draw() {
  requestAnimationFrame(draw);
  if (phase !== "play" || !snap) return;
  const view = viewSnap() || snap;
  drawWorld(view);
  const { me, alive } = drawPlayers(view);
  drawHUD(me, alive);
  drawPing();
}

/* ===================== INIT ===================== */
document.getElementById("avatarPreview").innerHTML = avatarSVG(0, 44);
draw();
connect();
</script>
