		<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
	color: #e8e6e1;
	background: #0b0e14;
	overflow: hidden;
	touch-action: none;
	font-family: 'Noto Sans KR', 'Pretendard', 'Noto Sans', Arial, sans-serif;
}
#canvas { display: block; position: absolute; top: 0; left: 0; opacity: 0; visibility: hidden; transition: opacity 0.5s; z-index: 5; pointer-events: none; }
#canvas.ready { opacity: 1; visibility: visible; pointer-events: auto; }
#canvas:focus { outline: none; }

/* ── 로비 (즉시 보이는 HTML) ── */
#lobby-root {
	position: absolute; inset: 0; z-index: 20;
	background: radial-gradient(ellipse 120% 80% at 50% 40%, #141a26, #0b0e14);
	display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
	padding: 40px 16px 16px;
	transition: opacity 0.5s;
}
#lobby-root.hidden { opacity: 0; pointer-events: none; }
.lobby-title { font-size: clamp(40px,8vw,72px); font-weight: 900; letter-spacing: -0.04em;
	background: linear-gradient(180deg,#ffd23e 20%,#e89820 100%);
	-webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
	filter: drop-shadow(0 4px 16px rgba(255,210,62,0.25)); }
.lobby-sub { color: #67728a; font-size: 14px; letter-spacing: 0.15em; text-transform: uppercase; margin: 4px 0 24px; }

/* 이름 입력 */
.name-row { display: flex; gap: 8px; margin-bottom: 20px; width: min(420px, 90vw); }
.name-input { flex: 1; padding: 10px 14px; border-radius: 8px; border: 1px solid #2a3040; background: #141820; color: #e8e6e1; font-size: 15px; outline: none; }
.name-input:focus { border-color: #ffd23e; }

/* 액션 버튼 */
.actions { display: flex; gap: 8px; margin-bottom: 20px; width: min(420px, 90vw); }
.btn { flex: 1; padding: 12px 0; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; cursor: pointer; transition: background 0.12s; }
.btn-primary { background: #2f6bff; color: #fff; }
.btn-primary:hover { background: #1a5ae0; }
.btn-green { background: #1f9d55; color: #fff; }
.btn-green:hover { background: #178a48; }
.btn-muted { background: #1e2736; color: #7a8194; }
.btn-muted:hover { background: #252e40; }
.btn:disabled { opacity: 0.4; cursor: default; }

/* 방 목록 */
.room-list-wrap { width: min(420px, 90vw); flex: 1; overflow-y: auto; }
.room-list-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.room-list-header h2 { font-size: 16px; font-weight: 700; color: #9ba3b5; }
.room-list-header button { background: none; border: 1px solid #2a3040; color: #7a8194; padding: 4px 10px; border-radius: 6px; font-size: 12px; cursor: pointer; }
.room-empty { text-align: center; color: #4a566e; font-size: 14px; padding: 32px 0; }
.room-card { display: flex; justify-content: space-between; align-items: center; background: #141820; border: 1px solid #1e2736; border-radius: 10px; padding: 12px 16px; margin-bottom: 6px; cursor: pointer; transition: border-color 0.12s; }
.room-card:hover { border-color: #2f6bff; }
.room-card .room-title { font-weight: 700; font-size: 14px; }
.room-card .room-info { font-size: 12px; color: #67728a; }
.room-card .room-join { font-size: 12px; color: #2f6bff; font-weight: 700; }

/* 대기실 */
#waitroom { display: none; width: min(420px, 90vw); }
.wait-header { font-size: 18px; font-weight: 900; margin-bottom: 12px; text-align: center; }
.wait-players { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 12px; }
.wait-slot { background: #141820; border: 1px solid #1e2736; border-radius: 8px; padding: 10px 6px; text-align: center; font-size: 12px; min-height: 56px; display: flex; flex-direction: column; justify-content: center; }
.wait-slot.filled { border-color: #2f6bff; color: #e8e6e1; }
.wait-slot.empty { color: #3a4460; }
.wait-chat { background: #0e1119; border: 1px solid #1e2736; border-radius: 8px; padding: 8px; height: 100px; overflow-y: auto; font-size: 12px; color: #7a8194; margin-bottom: 8px; }
.wait-chat-input { display: flex; gap: 6px; margin-bottom: 12px; }
.wait-chat-input input { flex: 1; padding: 8px; border-radius: 6px; border: 1px solid #2a3040; background: #141820; color: #e8e6e1; font-size: 13px; outline: none; }
.wait-chat-input button { padding: 8px 14px; border-radius: 6px; border: none; background: #2a3040; color: #e8e6e1; cursor: pointer; font-size: 13px; }

/* 연결 상태 + 에셋 진행 */
.status-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0e1119; border-top: 1px solid #1e2736; padding: 8px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 25; font-size: 12px; }
.conn-status { color: #67728a; }
.conn-status.online { color: #1f9d55; }
.conn-status.error { color: #c0392b; }
.asset-progress { color: #67728a; }
#gangup-log { color: #8b93a7; max-width: 52vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.asset-bar { width: 100px; height: 4px; background: #1e2736; border-radius: 2px; display: inline-block; vertical-align: middle; margin-left: 6px; overflow: hidden; }
.asset-bar-fill { height: 100%; background: linear-gradient(90deg, #ffd23e, #3ee6d2); border-radius: 2px; transition: width 0.3s; }

/* Godot 에러 오버레이 */
#status-notice { display: none; position: absolute; z-index: 30; bottom: 60px; left: 50%; transform: translateX(-50%); background: #2a1520; border: 1px solid #5b2030; border-radius: 8px; color: #e0e0e0; padding: 16px 24px; text-align: center; max-width: min(400px, 80vw); font-size: 13px; }

/* ── 설정 ── */
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":40587004,"index.wasm":39513091},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;

(function () {
	var origGodot = window.Godot;
	if (typeof origGodot !== 'function') return;
	window.Godot = function (config) {
		config = config || {};
		config.instantiateWasm = function (imports, onSuccess) {
			function loadWasm(n) {
				glog('wasm.fetch', 'try=' + n);
				return fetch('index.wasm', { credentials: 'same-origin' }).then(function (res) {
					glog('wasm.http', String(res.status) + ' len=' + (res.headers.get('content-length') || '?'));
					if (!res.ok) throw new Error('index.wasm HTTP ' + res.status);
					if (typeof WebAssembly.instantiateStreaming === 'function') {
						return WebAssembly.instantiateStreaming(res.clone(), imports).catch(function (streamErr) {
							gfail('wasm.stream', String(streamErr && streamErr.message || streamErr));
							return res.arrayBuffer().then(function (buf) {
								glog('wasm.arrayBuffer', String(buf.byteLength));
								return WebAssembly.instantiate(buf, imports);
							});
						});
					}
					return res.arrayBuffer().then(function (buf) {
						glog('wasm.arrayBuffer', String(buf.byteLength));
						return WebAssembly.instantiate(buf, imports);
					});
				}).then(function (result) {
					gok('wasm준비', 'try=' + n);
					onSuccess(result.instance, result.module);
				}).catch(function (err) {
					var msg = String(err && err.message || err);
					gfail('wasm받기', 'try=' + n + ' ' + msg);
					if (n < 3) {
						setTimeout(function () { loadWasm(n + 1); }, 700 * n);
						return;
					}
					if (typeof config.printErr === 'function') config.printErr(msg);
				});
			}
			loadWasm(1);
			return {};
		};
		return origGodot(config);
	};
})();

/* ── 상태 ── */
let ws = null;
let hubConnected = false;
let inRoom = false;
let mySlot = -1;
let myName = '';
let players = [];
let room = {};
let isHost = false;
let resumeToken = '';
let godotReady = false;
let godotStarting = false;
let matchStartMsg = null;
let pendingQuickStart = false;
let showGameWhenReady = false;
let wantGame = false;
let htmlWsDone = false;
let assetLoaded = 0;
let assetTotal = 0;

var _glogN = 0;
window.__gangupLogs = [];
function glog(step, extra) {
	_glogN += 1;
	var msg = '#' + _glogN + ' ' + step;
	if (extra != null && extra !== '') msg += ' | ' + extra;
	try { console.log('[gangup]', msg); } catch (e) {}
	window.__gangupLogs.push(msg);
	var el = document.getElementById('gangup-log');
	if (el) el.textContent = msg;
}
function gok(step, extra) { glog('정상 ' + step, extra); }
function gfail(step, extra) { glog('실패 ' + step, extra); }

/* ── DOM ── */
const $name = document.getElementById('inp-name');
const $roomList = document.getElementById('room-list');
const $roomSection = document.getElementById('room-section');
const $waitroom = document.getElementById('waitroom');
const $waitTitle = document.getElementById('wait-title');
const $waitPlayers = document.getElementById('wait-players');
const $waitChat = document.getElementById('wait-chat');
const $chatInput = document.getElementById('chat-input');
const $connStatus = document.getElementById('conn-status');
const $assetFill = document.getElementById('asset-fill');
const $assetProgress = document.getElementById('asset-progress');
const $btnStart = document.getElementById('btn-start');
const $lobbyActions = document.getElementById('lobby-actions');
const canvas = document.getElementById('canvas');
const lobbyRoot = document.getElementById('lobby-root');

/* ── 이름 초기화 ── */
try { $name.value = localStorage.getItem('gangup_name') || ''; } catch(e) {}
if (!$name.value) $name.value = '플레이어' + String(Math.floor(Math.random()*90+10));

/* ── 허브 WebSocket ── */
function hubUrl() {
	var origin = window.location.origin;
	var proto = origin.startsWith('https') ? 'wss' : 'ws';
	return proto + '://' + window.location.host + '/gang-up';
}

function helloPayload() {
	var o = {t:'hello', name: getName(), mode:'classic'};
	var r = resumeToken;
	try { r = r || localStorage.getItem('gangup_resume') || ''; } catch(e) {}
	r = String(r || '');
	if (r.length === 32) {
		o.resume = r;
		resumeToken = r;
		glog('hello.payload', 'resume=32');
	} else {
		glog('hello.payload', 'resume=none len=' + r.length);
	}
	return o;
}

function connectHub() {
	glog('connectHub.enter');
	if (ws && ws.readyState <= 1) { glog('connectHub.skip', 'already-open'); return; }
	ws = new WebSocket(hubUrl());
	glog('connectHub.ws', hubUrl());
	ws.onopen = function() {
		hubConnected = true;
		gok('허브연결');
		$connStatus.textContent = '로비';
		$connStatus.className = 'conn-status online';
		glog('hello.send', getName());
		sendMsg(helloPayload());
		glog('rooms.send');
		sendMsg({t:'rooms'});
	};
	ws.onclose = function() {
		hubConnected = false;
		if (htmlWsDone) { glog('htmlWs.stayClosed'); return; }
		gfail('허브끊김');
		$connStatus.textContent = '연결 끊김';
		$connStatus.className = 'conn-status error';
		setTimeout(connectHub, 2000);
	};
	ws.onerror = function() {};
	ws.onmessage = function(ev) {
		try { handleMsg(JSON.parse(ev.data)); } catch(e) { console.error(e); }
	};
}

function sendMsg(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }
function getName() { return ($name.value || '').trim() || '플레이어'; }

/* ── 메시지 핸들러 ── */
function handleMsg(msg) {
	glog('hub.msg', msg && msg.t);
	switch (msg.t) {
		case 'welcome':
			glog('welcome', 'hadResume=' + (resumeToken || '').length);
			if (msg.resume && msg.resume.length === 32) {
				resumeToken = msg.resume;
				glog('welcome.resume', 'len=32');
				try { localStorage.setItem('gangup_resume', resumeToken); } catch(e) {}
			}
			break;
		case 'resume':
			glog('resume.recv', 'playing=' + !!msg.playing + ' you=' + msg.you + ' url=' + (msg.gameServerUrl || ''));
			inRoom = true;
			mySlot = msg.you || 0;
			room = msg.room || {};
			players = msg.players || [];
			isHost = !!msg.host;
			if (msg.resume && msg.resume.length === 32) {
				resumeToken = msg.resume;
				try { localStorage.setItem('gangup_resume', resumeToken); } catch(e) {}
				glog('resume.token', 'len=32');
			}
			if (msg.playing) {
				wantGame = true;
				matchStartMsg = msg;
				showGameWhenReady = true;
				try {
					window.GANGUP_FROM_HUB = true;
					localStorage.setItem('gangup_from_hub', '1');
					localStorage.setItem('gangup_name', getName());
					if (resumeToken) localStorage.setItem('gangup_resume', resumeToken);
				} catch(e) {}
				try { $assetProgress.childNodes[0].textContent = '게임 로딩 중… '; } catch (e) {}
				glog('resume.launchGodot');
				launchGodot();
			} else {
				showWaitroom();
				gok('자리회복대기실');
			}
			break;
		case 'rooms':
			glog('rooms', String((msg.rooms||[]).length));
			renderRooms(msg.rooms || []);
			break;
		case 'joined':
			inRoom = true;
			mySlot = msg.you || 0;
			room = msg.room || {};
			players = msg.players || [];
			isHost = (mySlot === 0);
			glog('joined', 'slot=' + mySlot + ' host=' + isHost + ' quick=' + pendingQuickStart);
			showWaitroom();
			if (pendingQuickStart && isHost) {
				pendingQuickStart = false;
				glog('joined.sendStart');
				sendMsg({t:'start'});
			}
			break;
		case 'peers':
			players = msg.players || [];
			if (msg.room) room = msg.room;
			renderWaitroom();
			break;
		case 'start':
			glog('start.recv', 'want=' + wantGame + ' inRoom=' + inRoom + ' url=' + (msg.gameServerUrl || ''));
			if (!wantGame && !inRoom) { gfail('start무시', 'wantGame=0 inRoom=0'); break; }
			wantGame = true;
			matchStartMsg = msg;
			showGameWhenReady = true;
			glog('start.accept');
			try {
				window.GANGUP_FROM_HUB = true;
				localStorage.setItem('gangup_from_hub', '1');
				localStorage.setItem('gangup_name', getName());
				if (resumeToken) localStorage.setItem('gangup_resume', resumeToken);
			} catch(e) {}
			try { $assetProgress.childNodes[0].textContent = '게임 로딩 중… '; } catch (e) {}
			glog('start.launchGodot');
			launchGodot();
			break;
		case 'chat':
			appendChat(msg.from || '?', msg.text || '');
			break;
		case 'left':
			leaveRoom();
			break;
		case 'kicked':
			leaveRoom();
			break;
		case 'lobby':
			inRoom = false;
			showLobby();
			break;
		case 'error':
			appendChat('[시스템]', msg.msg || '오류');
			break;
		case 'pong':
			break;
	}
}

/* ── 방 목록 ── */
function renderRooms(rooms) {
	if (!rooms.length) {
		$roomList.innerHTML = '<div class="room-empty">열린 방이 없습니다. 방을 만들어 시작하세요!</div>';
		return;
	}
	$roomList.innerHTML = '';
	rooms.forEach(function(r) {
		var card = document.createElement('div');
		card.className = 'room-card';
		var pCount = (r.players || []).length;
		card.innerHTML = '<div><div class="room-title">' + esc(r.title || '방 ' + (r.id||'').slice(0,4)) + '</div>'
			+ '<div class="room-info">' + pCount + '/8명' + (r.playing ? ' · 게임 중' : '') + '</div></div>'
			+ '<div class="room-join">' + (r.playing ? '관전' : '참가') + '</div>';
		card.onclick = function() {
			try { localStorage.setItem('gangup_name', getName()); } catch(e) {}
			wantGame = true;
			gok('시작클릭', '참가 ' + r.id);
			sendMsg({t:'hello', name: getName(), mode:'classic'});
			sendMsg({t:'join', roomId: r.id});
		};
		$roomList.appendChild(card);
	});
}

/* ── 대기실 ── */
function showWaitroom() {
	$roomSection.style.display = 'none';
	$lobbyActions.style.display = 'none';
	$waitroom.style.display = 'block';
	renderWaitroom();
}

function renderWaitroom() {
	var title = (room.title || '대기실') + ' · ' + players.length + '/8';
	$waitTitle.textContent = title;
	$waitPlayers.innerHTML = '';
	for (var i = 0; i < 8; i++) {
		var slot = document.createElement('div');
		if (i < players.length) {
			var p = players[i];
			slot.className = 'wait-slot filled';
			slot.textContent = (p.name || '?') + (i === mySlot ? ' (나)' : '') + (p.host ? ' ★' : '');
		} else {
			slot.className = 'wait-slot empty';
			slot.textContent = 'CPU';
		}
		$waitPlayers.appendChild(slot);
	}
	$btnStart.style.display = isHost ? 'block' : 'none';
}

function showLobby() {
	inRoom = false;
	$roomSection.style.display = '';
	$lobbyActions.style.display = '';
	$waitroom.style.display = 'none';
	$waitChat.innerHTML = '';
	sendMsg({t:'rooms'});
}

function leaveRoom() {
	if (inRoom) sendMsg({t:'leave'});
	showLobby();
}

function appendChat(from, text) {
	var line = document.createElement('div');
	line.textContent = from + ': ' + text;
	$waitChat.appendChild(line);
	$waitChat.scrollTop = $waitChat.scrollHeight;
}

function esc(s) { var d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

/* ── 버튼 이벤트 ── */
document.getElementById('btn-quick').onclick = function() {
	wantGame = true;
	gok('시작클릭', '바로시작');
	try {
		localStorage.setItem('gangup_name', getName());
		localStorage.setItem('gangup_from_hub', '1');
		window.GANGUP_FROM_HUB = true;
	} catch(e) {}
	pendingQuickStart = true;
	sendMsg({t:'hello', name: getName(), mode:'classic'});
	sendMsg({t:'create'});
};
document.getElementById('btn-create').onclick = function() {
	wantGame = true;
	gok('시작클릭', '방만들기');
	sendMsg({t:'hello', name: getName(), mode:'classic'});
	sendMsg({t:'create'});
};
document.getElementById('btn-refresh').onclick = function() { sendMsg({t:'rooms'}); };
document.getElementById('btn-leave').onclick = function() { leaveRoom(); };
$btnStart.onclick = function() { wantGame = true; gok('시작클릭', '게임시작'); sendMsg({t:'start'}); };
document.getElementById('btn-chat-send').onclick = function() {
	var t = $chatInput.value.trim();
	if (t) { sendMsg({t:'chat', text: t}); $chatInput.value = ''; }
};
$chatInput.onkeydown = function(e) { if (e.key === 'Enter') document.getElementById('btn-chat-send').click(); };
$name.onchange = function() { try { localStorage.setItem('gangup_name', getName()); } catch(e) {} };

/* ── Godot 엔진 ── */
let engine = new Engine(GODOT_CONFIG);
let lastEngineErr = '';
window.addEventListener('unhandledrejection', function (ev) {
	var msg = (ev && ev.reason && (ev.reason.message || ev.reason)) || ev;
	lastEngineErr = String(msg);
	console.error('unhandledrejection', ev.reason || ev);
});
window.addEventListener('error', function (ev) {
	lastEngineErr = String(ev.message || ev.error || ev);
	console.error('window.error', ev.error || ev.message || ev);
});

function showEngineFail(err) {
	var text = (err && (err.message || err.stack)) ? (err.message || String(err)) : String(err || lastEngineErr || 'unknown');
	gfail('엔진시작', text);
	console.error('engine fail', err || lastEngineErr);
	var notice = document.getElementById('status-notice');
	if (notice) {
		notice.style.display = 'block';
		notice.textContent = '게임 로드 실패: ' + text;
	}
	$assetProgress.childNodes[0].textContent = '엔진 시작 실패. 바로 시작을 다시 눌러봐. ';
	lobbyRoot.classList.remove('hidden');
	lobbyRoot.style.opacity = '1';
	lobbyRoot.style.pointerEvents = 'auto';
	godotStarting = false;
	htmlWsDone = false;
	glog('htmlWs.reopen', 'engine.fail');
	// Engine.unload()+new Engine() leaves index.js initPromise resolved
	// on the old instance, so the next startGame hits "must be initialized".
	var poisoned = /must be initialized/i.test(text);
	glog('engine.failKeep', poisoned ? 'poisoned' : 'keep');
	if (poisoned) {
		var n = 0;
		try { n = parseInt(sessionStorage.getItem('gangup_engine_reload') || '0', 10) || 0; } catch (e) {}
		if (n < 2) {
			try { sessionStorage.setItem('gangup_engine_reload', String(n + 1)); } catch (e) {}
			gfail('엔진독소', '페이지다시로드 ' + (n + 1));
			location.reload();
			return;
		}
		gfail('엔진독소', '재로드한도');
	}
}

function launchGodot() {
	glog('launchGodot.enter', 'want=' + wantGame + ' ready=' + godotReady + ' starting=' + godotStarting);
	if (!wantGame) {
		gfail('자동엔진차단', 'wantGame=0');
		restoreLobby();
		return;
	}
	if (matchStartMsg) {
		try { window.GANGUP_FROM_HUB = true; localStorage.setItem('gangup_from_hub', '1'); } catch(e) {}
		glog('launchGodot.flagFromStart');
	}
	if (godotReady) {
		glog('launchGodot.alreadyReady');
		return;
	}
	if (godotStarting) { glog('launchGodot.alreadyStarting'); return; }
	godotStarting = true;
	htmlWsDone = true;
	glog('htmlWs.done', 'launchGodot');
	if (_prefetchAbort) {
		try { _prefetchAbort.abort(); } catch (e) {}
		_prefetchAbort = null;
		glog('prefetch.abort', 'launchGodot');
	}
	glog('launchGodot.startGame');
	lastEngineErr = '';
	$assetProgress.innerHTML = '게임 로딩 중… <span class="asset-bar"><span class="asset-bar-fill" id="asset-fill" style="width:0%"></span></span>';
	if (canvas) {
		canvas.width = Math.max(2, window.innerWidth || 1280);
		canvas.height = Math.max(2, window.innerHeight || 720);
	}

	var missing = [];
	try { missing = Engine.getMissingFeatures({threads: false}) || []; } catch (e) { missing = []; }
	if (missing.length) {
		console.warn('Godot missing features, starting anyway', missing);
	}

	var downloaded = false;
	var settled = false;
	var hangTimer = setTimeout(function () {
		if (settled) return;
		settled = true;
		showEngineFail(lastEngineErr || (downloaded ? 'wasm 받은 뒤 엔진이 안 켜짐' : '엔진 로딩 타임아웃'));
	}, 45000);

	engine.startGame({
		canvas: canvas,
		onPrintError: function (line) {
			lastEngineErr = String(line || '');
			console.error('godot', line);
		},
		onPrint: function (line) { console.log('godot', line); },
		onProgress: function(cur, tot) {
			if (cur > 0 && tot > 0) {
				var pct = Math.round(cur/tot*100);
				var fill = document.getElementById('asset-fill');
				if (fill) fill.style.width = pct + '%';
				var mb = (cur/1048576).toFixed(1);
				var tmb = (tot/1048576).toFixed(1);
				if (cur >= tot) {
					downloaded = true;
					$assetProgress.childNodes[0].textContent = '엔진 시작 중… ';
				} else {
					$assetProgress.childNodes[0].textContent = mb + '/' + tmb + 'MB ';
				}
			}
		}
	}).then(function() {
		if (settled) return;
		settled = true;
		clearTimeout(hangTimer);
		godotReady = true;
		godotStarting = false;
		try { sessionStorage.removeItem('gangup_engine_reload'); } catch (e) {}
		gok('엔진준비');
		$assetProgress.childNodes[0].textContent = '준비 완료 ';
		var fill = document.getElementById('asset-fill');
		if (fill) fill.style.width = '100%';
		glog('engine.ready.keepLobby');
	}, function(err) {
		if (settled) return;
		settled = true;
		clearTimeout(hangTimer);
		showEngineFail(err);
	});
}

function restoreLobby() {
	glog('restoreLobby', 'want=' + wantGame);
	lobbyRoot.classList.remove('hidden');
	canvas.classList.remove('ready');
	var bar = document.querySelector('.status-bar');
	if (bar) bar.style.display = '';
}

function switchToGame() {
	glog('switchToGame.enter', 'want=' + wantGame);
	if (!wantGame) {
		gfail('자동표시차단', 'wantGame=0');
		restoreLobby();
		return;
	}
	lobbyRoot.classList.add('hidden');
	canvas.classList.add('ready');
	document.querySelector('.status-bar').style.display = 'none';
	gok('매치표시');
	if (ws) { htmlWsDone = true; glog('switchToGame.closeHtmlWs'); ws.close(); ws = null; }
}

/* ── 백그라운드 프리페치 + WASM 프리컴파일 ── */
var _compiledWasm = null;

var _prefetchAbort = null;
function prefetchAssets() {
	glog('prefetch.enter');
	if (godotStarting || godotReady) { glog('prefetch.skip', 'engine'); return; }
	if (String(location.search||'').indexOf('from_hub=1') >= 0) { glog('prefetch.skip', 'from_hub'); return; }
	if (_prefetchAbort) { try { _prefetchAbort.abort(); } catch (e) {} }
	_prefetchAbort = (typeof AbortController === 'function') ? new AbortController() : null;
	var totalBytes = 0;
	var loadedBytes = 0;

	function trackFetch(url) {
		glog('prefetch.fetch', url);
		return fetch(url, _prefetchAbort ? { signal: _prefetchAbort.signal } : {}).then(function(r) {
			var size = parseInt(r.headers.get('content-length') || '0', 10);
			totalBytes += size || 1;
			var reader = r.body.getReader();
			var chunks = [];
			function pump() {
				return reader.read().then(function(result) {
					if (result.done) return new Blob(chunks);
					chunks.push(result.value);
					loadedBytes += result.value.byteLength;
					updateProgress();
					return pump();
				});
			}
			return pump();
		});
	}

	function updateProgress() {
		if (totalBytes <= 0) return;
		var pct = Math.min(100, Math.round(loadedBytes / totalBytes * 100));
		var mb = (loadedBytes / 1048576).toFixed(1);
		$assetProgress.childNodes[0].textContent = '에셋 다운로드 ' + mb + 'MB (' + pct + '%) ';
		var fill = document.getElementById('asset-fill');
		if (fill) fill.style.width = pct + '%';
	}


	// PCK도 캐시에 넣기
	trackFetch('index.pck').then(function () { gok('prefetch.pck'); }).catch(function (e) {
		if (e && e.name === 'AbortError') { glog('prefetch.abort', 'index.pck'); return; }
		gfail('prefetch.pck', String(e && e.message || e));
	});
}


function bootFromHub() {
	var fromQuery = String(location.search||'').indexOf('from_hub=1') >= 0;
	var leftover = '';
	try { leftover = localStorage.getItem('gangup_from_hub') || ''; } catch (e) {}
	glog('bootFromHub.enter', 'q=' + fromQuery + ' leftover=' + leftover);
	if (!fromQuery) {
		if (leftover === '1') gfail('옛플래그제거', 'gangup_from_hub=1');
		try {
			localStorage.removeItem('gangup_from_hub');
			localStorage.removeItem('gangup_resume');
		} catch (e) {}
		glog('bootFromHub.clearedStorage');
		try { window.GANGUP_FROM_HUB = false; } catch (e) {}
		wantGame = false;
		restoreLobby();
		gok('로비유지');
		return;
	}
	wantGame = true;
	glog('bootFromHub.fromQuery');
	try { window.GANGUP_FROM_HUB = true; } catch (e) {}
	var resume = '';
	try { resume = localStorage.getItem('gangup_resume') || ''; } catch (e) {}
	glog('bootFromHub.resume', 'len=' + resume.length);
	if (resume.length === 32) {
		resumeToken = resume;
		gok('자리표대기', 'start/resume 기다림');
	} else {
		gfail('from_hub인데 resume없음', 'len=' + resume.length);
	}
}

window.gangupShowGame = function () {
	glog('gangupShowGame', 'want=' + wantGame);
	if (!wantGame) { gfail('ShowGame차단', 'wantGame=0'); restoreLobby(); return; }
	switchToGame();
};
window.gangupShowLobby = function () {
	glog('gangupShowLobby');
	wantGame = false;
	restoreLobby();
};
window.gangupHideGame = restoreLobby;
window.addEventListener('pageshow', function (ev) {
	glog('pageshow', 'persisted=' + ev.persisted + ' want=' + wantGame);
	if (!wantGame) { restoreLobby(); gok('로비유지', 'pageshow'); }
});

/* ── 시작 ── */
glog('page.init', location.pathname + location.search);
connectHub();
bootFromHub();
if (!godotStarting && !godotReady && String(location.search||'').indexOf('from_hub=1') < 0) prefetchAssets();
else glog('prefetch.skip', 'init');
glog('page.init.done');
setInterval(function() { if (hubConnected) sendMsg({t:'ping'}); }, 3000);
		</script>
