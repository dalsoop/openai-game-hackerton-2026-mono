<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		$GODOT_HEAD_INCLUDE
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f2f5fa;
	background-color: #0b0e14;
	overflow: hidden;
	touch-action: none;
	font-family: -apple-system, 'Noto Sans KR', system-ui, sans-serif;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	position: fixed;
	inset: 0;
	background: #0b0e14;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 10;
}

.loading-logo {
	width: 96px;
	height: 96px;
	margin-bottom: 16px;
	animation: logoPulse 2s ease-in-out infinite;
}

@keyframes logoPulse {
	0%, 100% { transform: scale(1); opacity: 1; }
	50% { transform: scale(1.06); opacity: 0.85; }
}

.loading-title {
	font-size: 32px;
	font-weight: 900;
	letter-spacing: -0.02em;
	margin-bottom: 4px;
}

.loading-title span {
	color: #ffd23e;
}

.loading-sub {
	font-size: 13px;
	color: #67728a;
	margin-bottom: 32px;
}

.progress-wrap {
	width: min(380px, 80vw);
	display: none;
}

.progress-bar-bg {
	width: 100%;
	height: 10px;
	background: #1a2029;
	border-radius: 5px;
	overflow: hidden;
}

.progress-bar-fill {
	height: 100%;
	width: 0%;
	background: linear-gradient(90deg, #ffd23e, #3ee6d2);
	border-radius: 5px;
	transition: width 0.15s ease;
}

.progress-text {
	display: flex;
	justify-content: space-between;
	margin-top: 8px;
	font-size: 12px;
	color: #8d99b0;
	font-family: ui-monospace, monospace;
}

.loading-tip {
	position: fixed;
	bottom: 48px;
	left: 0;
	right: 0;
	text-align: center;
	font-size: 13px;
	color: #556178;
	letter-spacing: 0.02em;
}

#status-notice {
	display: none;
	background: #1a1520;
	border-radius: 12px;
	border: 1px solid #3a2040;
	color: #e0c0c0;
	line-height: 1.4;
	margin: 0 2rem;
	max-width: 480px;
	overflow: hidden;
	padding: 20px 24px;
	text-align: center;
	z-index: 1;
	font-size: 14px;
}

#status-notice::before {
	content: "오류가 발생했습니다";
	display: block;
	font-weight: 700;
	font-size: 16px;
	color: #ff5d5d;
	margin-bottom: 8px;
}

@media (prefers-reduced-motion: reduce) {
	.loading-logo { animation: none; }
	.progress-bar-fill { transition: none; }
}
		</style>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<svg class="loading-logo" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
				<path d="M32 4 L40 18 L32 14 L24 18 Z" fill="#ff5d5d"/>
				<path d="M60 32 L46 40 L50 32 L46 24 Z" fill="#4ea1ff"/>
				<path d="M32 60 L24 46 L32 50 L40 46 Z" fill="#5dd97c"/>
				<path d="M4 32 L18 24 L14 32 L18 40 Z" fill="#c98bff"/>
				<circle cx="32" cy="32" r="7" fill="#ffd23e">
					<animate attributeName="r" values="7;8.5;7" dur="2s" repeatCount="indefinite"/>
				</circle>
			</svg>
			<div class="loading-title">다굴 <span>같이하기</span></div>
			<div class="loading-sub">로딩 중…</div>

			<div class="progress-wrap" id="progress-wrap">
				<div class="progress-bar-bg">
					<div class="progress-bar-fill" id="progress-fill"></div>
				</div>
				<div class="progress-text">
					<span id="progress-pct">0%</span>
					<span id="progress-size">0 MB</span>
				</div>
			</div>

			<div id="status-notice"></div>

			<div class="loading-tip">8명이 한 판, 마지막 한 명이 승리합니다</div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusNotice = document.getElementById('status-notice');
	const progressWrap = document.getElementById('progress-wrap');
	const progressFill = document.getElementById('progress-fill');
	const progressPct = document.getElementById('progress-pct');
	const progressSize = document.getElementById('progress-size');
	const loadingSub = document.querySelector('.loading-sub');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		progressWrap.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('알 수 없는 오류가 발생했습니다.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('서비스 워커 등록에 실패했습니다.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('서비스 워커가 이미 존재합니다.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('서비스 워커 등록 중 오류:', err);
			});
		} else {
			const missingMsg = '오류\n다음 기능이 필요하지만 이 브라우저에서 지원하지 않습니다:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		loadingSub.textContent = '게임 데이터를 받고 있습니다…';
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					const pct = Math.round((current / total) * 100);
					const mb = (current / 1048576).toFixed(1);
					const totalMb = (total / 1048576).toFixed(1);
					progressFill.style.width = pct + '%';
					progressPct.textContent = pct + '%';
					progressSize.textContent = mb + ' / ' + totalMb + ' MB';
					if (pct > 95) {
						loadingSub.textContent = '시작하는 중…';
					}
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
