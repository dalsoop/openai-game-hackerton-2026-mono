<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>다굴 같이하기</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #f2f5fa;
	background-color: #0b0e14;
	overflow: hidden;
	touch-action: none;
	font-family: 'Noto Sans KR', 'Pretendard', 'Noto Sans', Arial, sans-serif;
}

#canvas {
	display: block;
	opacity: 0;
	transition: opacity 0.6s ease-in;
}

#canvas.ready {
	opacity: 1;
}

#canvas:focus {
	outline: none;
}

#status {
	position: absolute;
	left: 0; right: 0; top: 0; bottom: 0;
	background: radial-gradient(ellipse 120% 80% at 50% 40%, #141a26, #0b0e14);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 10;
	transition: opacity 0.6s ease-out;
}

#title-block {
	text-align: center;
	margin-bottom: 48px;
}

#title-block h1 {
	font-size: clamp(48px, 10vw, 96px);
	font-weight: 900;
	letter-spacing: -0.04em;
	margin: 0;
	background: linear-gradient(180deg, #ffd23e 20%, #e89820 100%);
	-webkit-background-clip: text;
	-webkit-text-fill-color: transparent;
	background-clip: text;
	filter: drop-shadow(0 4px 24px rgba(255, 210, 62, 0.3));
}

#title-block p {
	margin: 8px 0 0;
	font-size: clamp(14px, 2.5vw, 20px);
	letter-spacing: 0.2em;
	color: #67728a;
	text-transform: uppercase;
}

#loading-block {
	text-align: center;
	width: min(400px, 80vw);
}

#loading-block .hint {
	font-size: 13px;
	color: #4a566e;
	margin-bottom: 14px;
}

#status-progress {
	display: none;
	width: 100%;
	height: 6px;
	appearance: none;
	border: 0;
	border-radius: 999px;
	background: #1e2736;
	overflow: hidden;
}

#status-progress::-webkit-progress-bar {
	background: #1e2736;
}

#status-progress::-webkit-progress-value {
	background: linear-gradient(90deg, #ffd23e, #3ee6d2);
	border-radius: 999px;
}

#status-progress::-moz-progress-bar {
	background: linear-gradient(90deg, #ffd23e, #3ee6d2);
	border-radius: 999px;
}

#loading-text {
	margin-top: 12px;
	font-size: 13px;
	color: #67728a;
	letter-spacing: 0.06em;
}

#status-notice {
	display: none;
	background-color: #2a1520;
	border-radius: 8px;
	border: 1px solid #5b2030;
	color: #e0e0e0;
	line-height: 1.4;
	margin-top: 24px;
	padding: 16px 24px;
	text-align: center;
	max-width: min(400px, 80vw);
}
		</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<div id="title-block">
				<h1>다굴</h1>
				<p>8인 배틀로얄</p>
			</div>
			<div id="loading-block">
				<div class="hint">WASD 이동 · 마우스 조준 · 좌클릭 공격</div>
				<progress id="status-progress"></progress>
				<div id="loading-text"></div>
			</div>
			<div id="status-notice"></div>
		</div>

		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingText = document.getElementById('loading-text');
	const canvas = document.getElementById('canvas');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) return;
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) statusNotice.removeChild(statusNotice.lastChild);
		text.split('\n').forEach(function(line) {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		setStatusNotice(err instanceof Error ? err.message : typeof err === 'string' ? err : 'An unknown error occurred.');
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({ threads: GODOT_THREADS_ENABLED });

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let swp;
			try { swp = navigator.serviceWorker.getRegistration(); }
			catch (e) { swp = Promise.reject(new Error('Service worker registration failed.')); }
			Promise.race([
				swp.then(function(r) { if (r != null) return Promise.reject(new Error('SW exists')); return r; }).then(function() { return engine.installServiceWorker(); }),
				new Promise(function(resolve) { setTimeout(resolve, 2000); }),
			]).then(function() { window.location.reload(); }).catch(function(e) { console.error('SW error:', e); });
		} else {
			displayFailureNotice('Error\nThe following features required to run Godot projects on the Web are missing:\n' + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					var pct = Math.round(current / total * 100);
					var sizeMB = (current / 1048576).toFixed(1);
					var totalMB = (total / 1048576).toFixed(1);
					if (current >= total) {
						loadingText.textContent = '게임을 준비하는 중입니다…';
					} else {
						loadingText.textContent = sizeMB + ' / ' + totalMB + ' MB (' + pct + '%)';
					}
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadingText.textContent = '연결 중…';
				}
			},
		}).then(function() {
			statusOverlay.style.opacity = '0';
			canvas.classList.add('ready');
			setTimeout(function() { setStatusMode('hidden'); }, 600);
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
