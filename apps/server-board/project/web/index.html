<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-store" />
  <title>해커톤 게임 · Jenkins</title>
  <style>
    :root {
      --header: #111;
      --link: #204a87;
      --line: #c0c0c0;
      --bg: #f3f3f3;
      --row: #fff;
      --row2: #f8f8f8;
      --muted: #666;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: #111;
      font: 13px/1.45 "Trebuchet MS", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    }
    header {
      background: var(--header);
      color: #fff;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    header .logo { font-weight: 700; font-size: 20px; letter-spacing: -0.03em; }
    header .logo span { color: #d33833; }
    header .meta { color: #bbb; font-size: 12px; }
    header a { color: #9cf; }
    .crumb {
      padding: 6px 16px;
      background: #e6e6e6;
      border-bottom: 1px solid var(--line);
      font-size: 12px;
    }
    .crumb a { color: var(--link); }
    .layout { display: flex; min-height: calc(100vh - 86px); }
    aside {
      width: 220px;
      background: #f0f0f0;
      border-right: 1px solid var(--line);
      padding: 12px 0;
    }
    aside h2 {
      margin: 0 14px 8px;
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.06em;
    }
    aside button {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      padding: 6px 16px;
      font: inherit;
      cursor: pointer;
      color: var(--link);
    }
    aside button[aria-pressed="true"] {
      background: #fff;
      font-weight: 700;
      box-shadow: inset 3px 0 0 #d33833;
    }
    aside .task { margin: 16px 14px 0; }
    aside .task button, .icon-btn {
      display: inline-block;
      width: auto;
      background: #eee;
      border: 1px solid #bbb;
      padding: 4px 8px;
      color: #111;
      text-decoration: none;
      cursor: pointer;
      font: inherit;
    }
    aside .task button:hover, .icon-btn:hover { background: #fff; }
    main { flex: 1; padding: 12px 16px 40px; overflow: auto; }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 700; }
    .desc { color: var(--muted); margin: 0 0 12px; }
    table.jobs { width: 100%; border-collapse: collapse; background: var(--row); border: 1px solid var(--line); }
    table.jobs th {
      text-align: left;
      background: #f0f0f0;
      border-bottom: 1px solid var(--line);
      padding: 6px 8px;
      font-size: 12px;
    }
    table.jobs td { padding: 7px 8px; border-bottom: 1px solid #e4e4e4; vertical-align: middle; }
    table.jobs tr:nth-child(even) { background: var(--row2); }
    table.jobs tr:hover { background: #fff8dc; }
    table.jobs a.name { color: var(--link); font-weight: 700; text-decoration: none; }
    table.jobs a.name:hover { text-decoration: underline; }
    .sub { color: var(--muted); font-size: 11px; }
    .ball {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.55), 0 1px 1px rgba(0,0,0,0.25);
      vertical-align: middle;
    }
    .ball.blue { background: radial-gradient(circle at 35% 30%, #7ec8ff, #1d70c9 62%, #0b4f96); }
    .ball.red { background: radial-gradient(circle at 35% 30%, #ff9a93, #d33833 62%, #8e1b17); }
    .ball.yellow { background: radial-gradient(circle at 35% 30%, #ffe08a, #f0ad4e 62%, #b57d12); }
    .ball.grey { background: radial-gradient(circle at 35% 30%, #ddd, #9a9a9a 62%, #6d6d6d); }
    .ball.anime {
      background: radial-gradient(circle at 35% 30%, #cfe3ff, #7aa7d9 62%, #4a6f99);
      animation: pulse 0.7s linear infinite alternate;
    }
    @keyframes pulse { to { filter: brightness(1.35); } }
    .wx { font-size: 16px; }
    .counts { margin: 10px 0; font-size: 12px; color: var(--muted); }
    .legend { margin-top: 14px; font-size: 12px; color: var(--muted); }
    .legend .ball { margin-right: 4px; }
    .legend span { margin-right: 12px; white-space: nowrap; }
    footer {
      margin-top: 18px;
      padding-top: 8px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 11px;
    }
    footer a { color: var(--link); }
    @media (max-width: 800px) {
      .layout { display: block; }
      aside { width: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo"><span>Jenkins</span> · 해커톤</div>
    <div class="meta">환경 <code id="env">…</code> · 허브 <code id="hubFolder">…</code></div>
    <div class="meta" style="margin-left:auto">
      <a id="actions" href="https://github.com/dalsoop/openai-game-hackerton-2026-mono/actions" target="_blank" rel="noreferrer">GitHub Actions</a>
    </div>
  </header>
  <div class="crumb">
    <a href="./">대시보드</a> &gt; hackertone-games &gt; <span id="viewName">전체</span>
  </div>
  <div class="layout">
    <aside>
      <h2>보기</h2>
      <div id="filters">
        <button type="button" data-filter="all" aria-pressed="true">전체</button>
        <button type="button" data-filter="live">웹 켬</button>
        <button type="button" data-filter="empty">웹 끔</button>
        <button type="button" data-filter="hub">허브</button>
      </div>
      <div class="task">
        <h2>작업</h2>
        <button type="button" id="reload">지금 확인</button>
        <a class="icon-btn" href="https://github.com/dalsoop/openai-game-hackerton-2026-mono/actions/workflows/apps.yml" target="_blank" rel="noreferrer">배포 / 퍼지</a>
      </div>
    </aside>
    <main>
      <h1>프로젝트 hackertone-games</h1>
      <p class="desc">
        파란 구슬은 노드에 <code>index.html</code>이 있는 슬롯입니다.
        <code>/healthz</code>는 인그레스라 쓰지 않습니다. 웹을 끈 슬롯은 파일이 없어도 정상입니다.
      </p>
      <p class="counts" id="counts"></p>
      <table class="jobs">
        <thead>
          <tr>
            <th>상태</th>
            <th>이름</th>
            <th>레포 설정</th>
            <th>노드 파일</th>
            <th>허브 파드</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <p class="legend">
        <span><i class="ball blue"></i> 파일 있음</span>
        <span><i class="ball yellow"></i> 웹은 켰는데 파일 없음</span>
        <span><i class="ball grey"></i> 웹 끔 (빈 슬롯)</span>
        <span><i class="ball red"></i> 프로브 실패</span>
      </p>
      <footer>
        실행기: 브라우저 프로브 · <span id="stamp">아직 확인하지 않음</span>
      </footer>
    </main>
  </div>
  <script>
    const FILTER = { all: () => true, live: (s) => s.web, empty: (s) => !s.web, hub: (s) => s.hub };
    const VIEW = { all: "전체", live: "웹 켬", empty: "웹 끔", hub: "허브" };
    const BALL = { blue: "파일 있음", yellow: "웹은 켰는데 파일 없음", grey: "웹 끔", red: "프로브 실패", anime: "확인 중" };
    let catalog = { env: "—", hubFolders: [], slots: [], repo: "dalsoop/openai-game-hackerton-2026-mono" };
    let filter = "all";
    let lastResults = {};
    let probeGen = 0;

    function ball(kind) {
      const title = BALL[kind] || kind;
      return '<i class="ball ' + kind + '" title="' + title + '"></i>';
    }

    function label(result, emptyText) {
      if (result && result.skip) return emptyText;
      if (!result) return "확인 중";
      if (result.missingProbe) return "프로브 없음";
      if (result.ok && result.slot) return result.slot + " · " + result.ms + "ms";
      if (result.ok && result.shared) return "공유 허브 · " + result.ms + "ms";
      if (result.ok) return "있음 · " + result.ms + "ms";
      if (result.status === 404) return "없음";
      if (result.status === 502 || result.status === 503) return "파드 없음";
      return "실패 " + (result.status || "");
    }

    function verdict(slot, r) {
      if (!r || !r.files) return "anime";
      if (!slot.web) return "grey";
      if (r.files.missingProbe) return "grey";
      if (r.files.ok) return "blue";
      if (r.files.status === 404) return "yellow";
      return "red";
    }

    async function probe(url) {
      const started = performance.now();
      try {
        const res = await fetch(url, { cache: "no-store" });
        const text = await res.text();
        let slot = "";
        try { slot = JSON.parse(text).slot || ""; } catch { /* not json */ }
        return { ok: res.ok, status: res.status, ms: Math.round(performance.now() - started), slot };
      } catch (err) {
        return { ok: false, status: 0, ms: Math.round(performance.now() - started), body: String(err.message || err) };
      }
    }

    function render(results) {
      const body = document.getElementById("rows");
      body.innerHTML = "";
      const slots = (catalog.slots || []).filter(FILTER[filter] || FILTER.all);
      let nBlue = 0, nRed = 0, nGrey = 0, nYellow = 0, nRun = 0;
      for (const s of slots) {
        const r = results[s.folder] || {};
        const kind = verdict(s, r);
        if (kind === "blue") nBlue += 1;
        else if (kind === "red") nRed += 1;
        else if (kind === "yellow") nYellow += 1;
        else if (kind === "grey") nGrey += 1;
        else nRun += 1;
        const tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + ball(kind) + "</td>" +
          "<td><a class=\"name\" href=\"" + s.url + "\" target=\"_blank\" rel=\"noreferrer\">" + s.folder + "</a>" +
            "<div class=\"sub\">" + (s.title || "") + "</div></td>" +
          "<td>" + (s.web ? "웹 켬" : "웹 끔") + (s.hub ? " · YAML 허브" : "") + "</td>" +
          "<td>" + label(r.files, "해당 없음") + "</td>" +
          "<td>" + (s.hub ? label(r.hub, "확인 중") : "없음") + "</td>" +
          "<td><a class=\"icon-btn\" href=\"" + s.url + "\" target=\"_blank\" rel=\"noreferrer\">열기</a> " +
            "<button type=\"button\" class=\"icon-btn\" data-copy=\"" + s.url + "\">복사</button></td>";
        body.appendChild(tr);
      }
      document.getElementById("counts").textContent =
        slots.length + " 슬롯  ·  파일 " + nBlue + "  ·  웹은 켰는데 파일 없음 " + nYellow +
        "  ·  웹 끔 " + nGrey + "  ·  실패 " + nRed + "  ·  확인 중 " + nRun;
    }

    async function refresh() {
      document.getElementById("env").textContent = catalog.env || "—";
      const hubs = catalog.hubFolders || [];
      document.getElementById("hubFolder").textContent = hubs.length ? (hubs.length + "개 (YAML)") : "없음";
      document.getElementById("viewName").textContent = VIEW[filter] || "전체";
      if (catalog.repo) {
        document.getElementById("actions").href = "https://github.com/" + catalog.repo + "/actions";
      }
      const gen = ++probeGen;
      const results = {};
      render(results);
      const self = await probe("/slot-file/server-board");
      const missing = await probe("/slot-file/__no_such_slot__");
      if (gen !== probeGen) return;
      const installed = self.ok && missing.status === 404;
      const sampleHub = await probe("/slot-hub/server-pig-dev1");
      const perHub = sampleHub.ok && Boolean(sampleHub.slot);
      const sharedHub = perHub ? { ok: false, status: 0, ms: 0 } : await probe("/health");
      if (gen !== probeGen) return;
      await Promise.all((catalog.slots || []).map(async (s) => {
        const files = installed
          ? await probe("/slot-file/" + s.folder)
          : { missingProbe: true, ok: false, status: 0, ms: 0 };
        let hub = { skip: true };
        if (s.hub && perHub) hub = await probe("/slot-hub/" + s.folder);
        else if (s.hub) hub = Object.assign({}, sharedHub, { shared: true });
        results[s.folder] = { files, hub };
      }));
      if (gen !== probeGen) return;
      lastResults = results;
      render(results);
      document.getElementById("stamp").textContent = installed
        ? ("노드 파일 기준 " + new Date().toLocaleString("ko-KR") +
          (perHub ? " · 슬롯별 허브" : (sharedHub.ok ? " · 허브는 공유 프로세스 하나" : " · 허브 응답 없음")))
        : "Caddy /slot-file 경로가 아직 없습니다.";
    }

    async function boot() {
      try {
        catalog = Object.assign(catalog, await (await fetch("./slots.json", { cache: "no-store" })).json());
      } catch { /* empty */ }
      await refresh();
    }

    document.getElementById("reload").onclick = () => refresh();
    document.getElementById("filters").onclick = (ev) => {
      const btn = ev.target.closest("button[data-filter]");
      if (!btn) return;
      filter = btn.getAttribute("data-filter");
      for (const el of document.querySelectorAll("#filters button")) {
        el.setAttribute("aria-pressed", el === btn ? "true" : "false");
      }
      document.getElementById("viewName").textContent = VIEW[filter] || "전체";
      render(lastResults);
    };
    document.getElementById("rows").onclick = async (ev) => {
      const btn = ev.target.closest("button[data-copy]");
      if (!btn) return;
      try {
        await navigator.clipboard.writeText(btn.getAttribute("data-copy"));
        btn.textContent = "복사함";
        setTimeout(() => { btn.textContent = "복사"; }, 1000);
      } catch {
        btn.textContent = "실패";
        setTimeout(() => { btn.textContent = "복사"; }, 1200);
      }
    };
    boot();
  </script>
</body>
</html>
